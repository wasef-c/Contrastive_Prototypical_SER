# Contrastive Learning Ablation with Unfrozen Emotion2Vec
# Train on MSPP only → test on IEMO, MSPI, CMUMOSEI, SAMSEMO (4 test sets).
# Ablates: contrastive loss type, unfreeze depth (E2V 0/2/4, BERT 0/4).
# Run with: python runner.py --config configs/contrastive_ablation.yaml --all
#
# VRAM budget: 24 GB

template_config: &template
  wandb_project: "emotion2vec_finetune_sweep_V2_LOLLL"
  seeds: [42]

  # Task
  task_type: "classification"
  num_classes: 4

  # Model
  modality: "both"
  audio_dim: 768
  text_model_name: "bert-base-uncased"
  text_max_length: 128
  hidden_dim: 1024
  dropout: 0.1

  # Emotion2Vec encoder
  audio_encoder_type: "emotion2vec"
  audio_model_name: "iic/emotion2vec_base"
  unfreeze_audio_layers: 2
  audio_learning_rate: 5e-7
  max_audio_seconds: 30

  # BERT defaults (frozen)
  unfreeze_bert_layers: 0
  bert_learning_rate: 5e-7

  # Fusion
  fusion_type: "cross_attention"
  fusion_hidden_dim: 1024
  num_attention_heads: 8

  # Training
  num_epochs: 50
  batch_size: 6
  gradient_accumulation_steps: 20
  learning_rate: 5e-6
  weight_decay: 1e-4
  val_split: 0.1
  early_stopping_patience: 5

  # Contrastive defaults (off unless overridden)
  use_contrastive: false
  contrastive_loss_type: "supervised"
  contrastive_weight: 0.5
  contrastive_temperature: 0.07
  contrastive_warmup_epochs: 5
  projection_dim: 128
  projection_hidden_dim: 512

  # Two-stage defaults (off)
  use_two_stage_training: false
  stage1_percentile: 50
  stage1_epochs: 30
  stage2_lr_factor: 0.1

  # Proto defaults (off)
  use_prototypical_weighting: false
  use_prototypical_label_smoothing: false
  use_domain_adversarial: false
  use_proto_predictor: false

  # Dataset — MSPP only, 4 test sets
  train_dataset: "MSPP"
  test_datasets: ["IEMO", "MSPI", "CMUMOSEI", "SAMSEMO"]

  expected_vad:
    0: [0.4896, 0.5458, 0.5458]
    1: [0.7127, 0.5518, 0.5518]
    2: [0.3060, 0.4895, 0.4895]
    3: [0.2397, 0.6102, 0.6102]


