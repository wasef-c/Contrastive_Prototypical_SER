    muted_mixup_alpha: 1.0
    muted_mixup_general_soft: true
    muted_mixup_fold_lambda: false
    muted_mixup_hard_control: true

  # ---- THE control the novelty claim actually needs ----
  #
  # Standard mixup is ALREADY soft: its target is lam * y_source + (1 - lam) *
  # y_partner. Comparing the geometry-derived target only against a HARD label
  # conflates two effects, soft beating hard (textbook) and geometry beating
  # lambda-interpolation (the claim). uf4_softmix_ctrl is a worse-than-vanilla
  # baseline, so the +0.63 measured against it overstates the contribution.
  #
  # The two soft targets are genuinely different supervision. Over 40,000
  # blends their median total-variation distance is 0.41, their argmax agrees
  # on 63 percent, and median entropy is 0.39 for vanilla against 0.95 for
  # geometry. Vanilla can only place mass on the two endpoint classes;
  # geometry places more than a quarter of its mass on a THIRD class in 37
  # percent of blends, which is the thing lambda-interpolation cannot express.
  #
  # The known risk runs the other way: on the 32 percent of blends whose
  # endpoints share a class, vanilla is correctly one-hot while geometry is
  # only 0.502 confident. If geometry loses, that is the likely reason.
  - <<: *template
    name: "uf4_softmix_vanilla"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true
    muted_mixup_vanilla_target: true

  # Same, in the aggressive regime, matched to uf4_softmix_agg.
  - <<: *template
    name: "uf4_softmix_agg_vanilla"
    unfreeze_audio_layers: 4
