    muted_mixup_target_shuffle: true

  # ==== Global Mixup (Xie et al., AAAI 2023, arXiv 2206.02734) ====
  #
  # The closest published method to ours in MOTIVATION. It states the same
  # problem, that mixup's label "is simply combined from the labels of the
  # original sample pairs without reasonable judgment, resulting in ambiguous
  # labels", and relabels the blend from global relationships. The signal is
  # what differs, and that is exactly the comparison worth making: Global
  # Mixup reads structure out of the UNSUPERVISED feature space, ours reads
  # it out of ANNOTATED affect space. GenLabel covers the generative-density
  # branch of the same family; this covers the similarity-vote branch.
  #
  # Their equations 3-5 implemented directly: the blend's label is a softmax
  # over gamma-scaled cosine similarities to every real sample in the batch,
  # used to take a weighted vote over those samples' one-hot labels. Only
  # blends whose vanilla label is overconfident (argmax >= theta) are
  # relabelled; theta = 1/c relabels all of them, which needs no threshold
  # chosen and matches our arm, which also labels every blend.
  #
  # Adaptations documented in utils/muted_mixup.py. The one that matters:
  # the paper TUNES gamma over {1, 2, 4, 6}, and tuning here would mean
  # selecting on test. Instead it is fixed a priori at 4, because at that
  # value the target's entropy (0.858) matches our own target's (0.851), so
  # the comparison isolates what the target SAYS rather than how sharp it
  # is. gamma = 1 runs as the sensitivity check at the paper's low end,
  # where the target is nearly uniform (entropy 1.340 against a maximum of
  # 1.386). Same two-setting treatment GenLabel received.

  - <<: *template
    name: "uf4_globalmix"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: "5e-6"
    seeds: [42, 189, 7]
    test_datasets: [IEMOFULL, SAMSEMO, CMUMOSEI]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
