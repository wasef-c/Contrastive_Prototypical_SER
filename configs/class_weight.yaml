# Is the class weighting pushing the decision boundary off neutral?
#
# THE OBSERVATION. Both corpora are UNDER-predicted for neutral by the no-aux
# baseline: IEMOCAP true 38.0 percent against 30.9 predicted, SAMSEMO 43.9
# against 36.7. The prototypicality head then pushes further in the same
# direction, to 26.8 and 35.0. So the head is not correcting an over-prediction
# of neutral, it is compounding an existing under-prediction, and the extra
# mass lands mostly on sad, whose VAD centroid is the closest to neutral's
# (euclidean 0.16, against 0.29 for happy and 0.35 for angry).
#
# WHY IT MATTERS. The ranking improvement is real but the decisions do not
# capture it. On the binary neutral-against-emotional task the aux arm gains
# only +0.56 points at argmax on IEMOCAP and LOSES 0.18 on SAMSEMO, while at
# the best possible threshold it gains +0.94 and +0.31. The whole SAMSEMO
# deficit is threshold placement, not ranking. If inverse-frequency weighting
# is what puts the boundary in the wrong place, softening it should let argmax
# land nearer the optimum.
#
# WHAT TO EXPECT. UAR is macro-averaged, so weakening the weighting will
# predict minority classes less and UAR will probably fall in ABSOLUTE terms;
# weighted F1 should rise for the same reason. That is not the question. The
# question is whether the aux-minus-base GAP stops being undercut at the
# decision level, and whether neutral_auc, which is threshold-free and should
# be largely indifferent to class weighting, holds up.
#
# One seed each. Read the direction and rough size, nothing finer.

template_config: &template
  wandb_project: "MVP_ClassWeight"
  seeds: [42]

  # Task
  task_type: "classification"
  num_classes: 4

  # Model
  modality: "both"
  audio_dim: 768
  text_model_name: "bert-base-uncased"
  text_max_length: 128
  hidden_dim: 1024
  dropout: 0.1

  # Encoders. Frozen for screening, so frame features are read from the
  # existing cache and no extraction runs.
  audio_encoder_type: "emotion2vec"
  audio_model_name: "iic/emotion2vec_base"
  unfreeze_audio_layers: 0
  audio_learning_rate: 1e-5
  max_audio_seconds: 10
  unfreeze_bert_layers: 0
  bert_learning_rate: 2e-5

  # Pooling
  audio_pooling: "frames"
  num_frames: 32
  num_attn_heads_pool: 4
  attn_pool_hidden: 256
  use_mean_pool_control: false

  # Fusion
  fusion_type: "cross_attention"
  fusion_hidden_dim: 1024
  num_attention_heads: 8

  # Training. Validation is not used for model selection; the reported model
  # is the SWA average of the last five epochs.
  num_epochs: 8
  batch_size: 16
  eval_batch_size: 16
  gradient_accumulation_steps: 2
  num_workers: 2
  learning_rate: 5e-6
  weight_decay: 1e-4
  val_split: 0.25
  use_early_stopping: false
  model_selection: swa_last_n
  swa_last_n: 3
  class_weight_mode: inverse_freq
  save_predictions: true
  train_subsample_frac: 1.0
  use_length_bucketing: true
  length_bucket_window: 50

  # Gradient checkpointing off: the machine has 16 GB of VRAM idle at batch
  # 16, so there is no reason to pay the recompute. Verified bitwise
  # identical to checkpointing on (same loss to ten decimals, same gradients
  # across all 89,183,496 trainable elements), so runs made either way stay
  # comparable. Excluded from the config fingerprint for the same reason.
  use_gradient_checkpointing: false

  # Defaults: everything off
  use_prototypical_weighting: false
  use_prototypical_label_smoothing: false
  use_contrastive: false
  use_domain_adversarial: false
  use_modality_adversarial: false
  use_prototypical_adversarial: false
  use_multiview_prototypicality: false
  use_memory_bank: false
  use_cross_modal_projection: false
  use_two_stage_training: false
  use_proto_predictor: false
  proto_predictor_hidden_dim: 0
  proto_target: "residual"
  proto_metric: "mahalanobis"
  proto_predictor_weight: 1.0
  proto_predictor_shuffle: false
  use_proto_dist_logits: false
  proto_dist_permute: false
  proto_centroid_consensus_q: 0.0
  proto_dist_alpha_min: 0.0
  use_vadmix: false
  use_vrex: false
  use_curriculum_learning: false
  use_corpus_balanced_sampler: false
  use_hierarchical_head: false
  use_proto_atyp_split: false

  # Auxiliary head defaults
  use_annotator_meta: true
  use_aux_vad_cluster: false
  aux_vad_task: "cluster"
  aux_vad_cluster_scope: "per_class"
  aux_vad_clusters_per_class: 2
  aux_vad_cluster_weight: 0.2
  aux_vad_cluster_init: "random"
  aux_vad_head_depth: 1
  aux_vad_subtype_dim: 16
  aux_vad_agreement_weight: false
  aux_vad_shuffle: false

  train_dataset: ["MSPP"]
  # MSP-Improv and CMU-MOSEI are dropped from evaluation as of 2026-09-12:
  # the paper reports IEMOCAP and SAMSEMO-EN only, and each extra corpus is
  # paid for twice per seed, once in the metrics pass and again in the
  # prediction dump, which is a second full forward pass. Measured on
  # uf4_res_aux, the two dumps alone cost 211s per seed.
  #
  # Cost of this: MSP-Improv is one of only two evaluation corpora carrying
  # real per-utterance VAD (SAMSEMO and CMU-MOSEI are all 0.5 fallback), so
  # the auxiliary-head R2 analysis loses its second cross-corpus datapoint.
  # Re-add it on an individual arm if that check is wanted again.
  test_datasets: ["IEMO", "SAMSEMO"]

  # MSPI centroids (used as prototypes elsewhere; harmless when unused)
  expected_vad:
    0: [0.4895, 0.4885, 0.5267]
    1: [0.6369, 0.6091, 0.6089]
    2: [0.3567, 0.3964, 0.4427]
    3: [0.2475, 0.7317, 0.7516]



experiments:
  - <<: *template
    name: "cw_sqrt_base"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: false
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "cw_sqrt_res"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: true
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "cw_none_base"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: false
    class_weight_mode: "none"

  - <<: *template
    name: "cw_none_res"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: true
    class_weight_mode: "none"

  # Headline pair at sqrt_inverse_freq, seeds 4 more to reach five. Seed 42
  # already exists as cw_sqrt_base / cw_sqrt_res and is not repeated, since the
  # runner has no skip-completed logic.
  #
  # At seed 42 this weighting moved every gap in the right direction at once:
  # IEMOCAP neutral_auc +1.18 -> +1.54, UAR +0.21 -> +1.09, and weighted F1
  # -0.97 -> +0.53, a sign reversal. The mechanism is unchanged; only the
  # starting point moved. Under inverse_freq the baseline already
  # under-predicts neutral (33.1 percent against a true 38.0), so the head's
  # push away from neutral overshoots into sad. Under sqrt the baseline
  # over-predicts (43.5) and the same push lands at 37.9, within 0.1 of truth.
  #
  # Absolute UAR is LOWER here than under inverse_freq (61.49 against 62.32 on
  # IEMOCAP) and absolute neutral_auc dips slightly (80.76 against 81.09). The
  # trade is a little headline performance for a larger, cleaner effect with no
  # weighted-F1 penalty. Five seeds decide whether the seed-42 pattern is real.
  - <<: *template
    name: "cw_sqrt_base_more"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [189, 7, 1234, 2024]
    use_proto_predictor: false
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "cw_sqrt_res_more"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [189, 7, 1234, 2024]
    use_proto_predictor: true
    class_weight_mode: "sqrt_inverse_freq"

  # Capacity-matched placebo at the headline setting. Identical to cw_sqrt_res
  # in every respect except proto_predictor_shuffle, which permutes the aux
  # target within the batch: same head, same parameter count, same gradient
  # path, same target marginal, only the sample-to-target pairing destroyed.
  #
  # This is the comparison the specificity claim rests on. It is run at
  # sqrt_inverse_freq because that is now the headline weighting, and because
  # under inverse_freq the placebo sat significantly BELOW baseline on IEMOCAP
  # (-0.418, 0/5, p=0.019). If that holds here the res-ctrl gap is wider than
  # res-base; if the placebo is inert instead, then part of what looked like
  # mechanism at inverse_freq was the placebo being dragged down, and res-ctrl
  # measured here is the honest number. Either outcome is reportable, but the
  # grid of hyperparameter sensitivity runs should be built on whichever it is.
  - <<: *template
    name: "cw_sqrt_ctrl"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7, 1234, 2024]
    use_proto_predictor: true
    proto_predictor_shuffle: true
    class_weight_mode: "sqrt_inverse_freq"

  # --- Sensitivity cells around the headline configuration ---------------
  # Both vary only the auxiliary head, so the paired baseline is the existing
  # five-seed cw_sqrt_base and is not retrained. Three seeds each, drawn from
  # the headline five so the pairing is exact. Judged on UAR, with neutral_auc
  # reported alongside.

  # Does the effect need class-covariance whitening? With target 'residual',
  # proto_metric euclidean sets _proto_whiten to None, so the target becomes
  # the raw VAD offset from the class centre rather than the whitened one. If
  # the gain survives, the claim is about the residual idea; if it collapses,
  # the claim is about covariance structure. Either is reportable, but they
  # are different papers.
  - <<: *template
    name: "sens_euclid_res"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    proto_metric: "euclidean"
    class_weight_mode: "sqrt_inverse_freq"

  # Does the head have to be linear? Every result so far uses hidden_dim 0, a
  # bare Linear from the fused representation to the target. A hidden layer
  # adds capacity and nonlinearity; paired with the shuffled placebo this
  # separates "the target carries information" from "the head is big enough
  # to matter".
  - <<: *template
    name: "sens_hidden256_res"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    proto_predictor_hidden_dim: 256
    class_weight_mode: "sqrt_inverse_freq"

  # Raw VAD as the auxiliary target. The residual is an affine function of VAD
  # given the class, and the class is exactly what the main head computes, so
  # "prototypicality" may be doing no work beyond VAD multi-task learning.
  # This is the direct test. Same head, same output width (3), same loss
  # weight; the target is the sample's VAD with no centroid subtraction and no
  # whitening. Five seeds because the answer decides what the paper claims:
  # if raw VAD is null the prototypicality framing stands, if it matches then
  # the honest title is about VAD auxiliary supervision.
  - <<: *template
    name: "sens_rawvad_res"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7, 1234, 2024]
    use_proto_predictor: true
    proto_target: "rawvad"
    class_weight_mode: "sqrt_inverse_freq"

  # Shuffled control for the hidden-256 cell. That cell changes head capacity,
  # which is the one thing the placebo exists to hold fixed, so its res-base
  # number is uninterpretable without a capacity-matched partner at the same
  # width. Three seeds, matching sens_hidden256_res.
  - <<: *template
    name: "sens_hidden256_ctrl"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    proto_predictor_hidden_dim: 256
    proto_predictor_shuffle: true
    class_weight_mode: "sqrt_inverse_freq"

  # --- Reverse direction: train on IEMOCAP, test on MSP-Podcast and SAMSEMO -
  # Every result so far trains on MSP-Podcast, so "one training corpus" is a
  # standing limitation. IEMOCAP is 4,490 rows against MSP-Podcast's 80,941,
  # so these runs are roughly four times faster and three seeds is affordable
  # as a screen. Three arms, because a res-base contrast without the placebo
  # would not be readable: the SAMSEMO result already showed the placebo can
  # carry most of an apparent gain.
  #
  # Expect weaker and noisier numbers than the forward direction. The class
  # centroids are fitted on a quarter of a small corpus with ten speakers, so
  # the auxiliary target itself is estimated far less precisely than it is
  # from MSP-Podcast. A null here would be evidence about centroid estimation,
  # not necessarily about the mechanism.
  - <<: *template
    name: "iemo_base"
    train_dataset: "IEMO"
    test_datasets: ["MSPP", "SAMSEMO"]
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: false
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "iemo_ctrl"
    train_dataset: "IEMO"
    test_datasets: ["MSPP", "SAMSEMO"]
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    proto_predictor_shuffle: true
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "iemo_res"
    train_dataset: "IEMO"
    test_datasets: ["MSPP", "SAMSEMO"]
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    class_weight_mode: "sqrt_inverse_freq"

  # --- VA only, at the headline configuration ----------------------------
  # Dominance is the least reliable axis: the narrowest range in use
  # (p5-p95 of 2.80 against 3.25 for valence) with comparable absolute
  # disagreement, and Mahalanobis whitening UP-weights it because its variance
  # is smallest. An earlier single-seed run (va_res, bert_lr 2e-5,
  # inverse_freq) landed within noise of the full-VAD arm: IEMOCAP 61.76
  # against 61.95 UAR and 80.31 against 80.36 neutral_auc. This repeats it at
  # the headline setting with three seeds. The paired control is the existing
  # cw_sqrt_ctrl, whose head is three wide rather than two; if this arm wins,
  # a matched two-wide control is needed before the number is quotable.
  - <<: *template
    name: "va_sqrt_res"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    # One seed as a screen. Seed 42 only, so it pairs against the existing
    # seed-42 baseline and residual. Widen to three seeds only if it looks
    # different from the full-VAD arm; a one-seed read cannot resolve an
    # effect this size (IEMOCAP UAR seed sd is about 0.7 against a 0.6 effect)
    # and is here to decide whether the arm is worth more GPU time.
    seeds: [42]
    use_proto_predictor: true
    proto_vad_dims: [0, 1]
    class_weight_mode: "sqrt_inverse_freq"

  # --- WavLM at the headline configuration, all three arms ---------------
  # The earlier WavLM comparison was one seed and showed roughly four times
  # weaker selectivity (res-ctrl +0.28 against +1.23 for emotion2vec), inside
  # one sd of zero. Three seeds and all three arms settle whether the
  # mechanism exists on the standard SSL encoder at all.
  #
  # The pooling confound is now REMOVED. WavLMEncoder gained a frames path,
  # so these arms hand the fusion a time axis through the same AttentionPool
  # emotion2vec uses, giving audio_dim 3072 on both sides. Earlier WavLM
  # numbers (single seed, inverse_freq) used mean pooling at 768 and are not
  # comparable to these; a weak result here is attributable to the encoder
  # rather than to the lost time axis.
  - <<: *template
    name: "wl_sqrt_base"
    audio_encoder_type: "wavlm"
    audio_model_name: "microsoft/wavlm-base-plus"
    audio_pooling: "frames"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: false
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "wl_sqrt_ctrl"
    audio_encoder_type: "wavlm"
    audio_model_name: "microsoft/wavlm-base-plus"
    audio_pooling: "frames"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    proto_predictor_shuffle: true
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "wl_sqrt_res"
    audio_encoder_type: "wavlm"
    audio_model_name: "microsoft/wavlm-base-plus"
    audio_pooling: "frames"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    class_weight_mode: "sqrt_inverse_freq"

  # --- Is the IEMOCAP-trained deficit convergence or capacity? ------------
  # Training on IEMOCAP, both auxiliary arms sit BELOW the no-aux baseline on
  # every corpus (res-base UAR -0.97 on MSP-Podcast, -2.51 on SAMSEMO, 0/3
  # seeds). The train/val curves say this is underfitting, not overfitting:
  # at epoch 8 the baseline has a train-val UAR gap of 3.8 points while both
  # auxiliary arms have 0.6, and their TRAIN UAR is 5 to 6 points lower. The
  # auxiliary objective is competing with the main task, and 4,490 rows over
  # 8 epochs leaves no slack to absorb it.
  #
  # Doubling the budget to 16 epochs distinguishes the two explanations. If
  # the deficit is convergence speed the arms should close on the baseline;
  # if it is a hard capacity ceiling they will not. One seed, because this
  # decides which sentence goes in the limitations section rather than
  # producing a reported number. SWA window widened in proportion.
  - <<: *template
    name: "iemo16_base"
    train_dataset: "IEMO"
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    num_epochs: 16
    swa_last_n: 6
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: false
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "iemo16_res"
    train_dataset: "IEMO"
    test_datasets: ["MSPP", "SAMSEMO"]
    num_epochs: 16
    swa_last_n: 6
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: true
    class_weight_mode: "sqrt_inverse_freq"

  # --- Is the headline understated at 8 epochs? --------------------------
  # Training on IEMOCAP, the auxiliary arm sat BELOW baseline at 8 epochs and
  # ABOVE it at 16, on all four transfer metrics, with in-domain validation
  # recovering from -2.22 to -0.22. The training curves showed the auxiliary
  # arm reaching a lower TRAIN UAR at the same epoch, so the objective
  # competes with the main task and needs a longer budget to pay off.
  #
  # Every MSP-Podcast arm in this file uses 8 epochs. If the same convergence
  # lag applies there, the reported +0.72 UAR and +1.62 AUCneu understate the
  # effect. One seed for base and residual decides whether the full five-seed
  # set is worth rerunning at 16 epochs. MSP-Podcast epochs are roughly 35
  # minutes, so this pair is about 10 hours against 2.5 for an 8-epoch run.
  #
  # Read the TRAIN curve as well as the transfer numbers: at 16 epochs on
  # IEMOCAP the baseline overfitted harder (train-val UAR gap 12.7 against the
  # residual's 8.0), so part of that reversal was the baseline degrading
  # rather than the residual improving.
  - <<: *template
    name: "ep16_base"
    num_epochs: 16
    swa_last_n: 6
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: false
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "ep16_res"
    num_epochs: 16
    swa_last_n: 6
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: true
    class_weight_mode: "sqrt_inverse_freq"

  # --- Two untried levers, one seed each as screens -----------------------
  # Everything tried so far either matches the headline or loses to it: dose
  # response flat across 8x, VA-only within noise, hidden-256 lower on the
  # reported corpora, euclidean collapses AUCneu, longer budget has no
  # headroom on MSP-Podcast. These two are the remaining options that have a
  # reason to be BETTER rather than merely different.

  # Shared whitening. PREDICTION REGISTERED BEFORE RUNNING: this should be
  # roughly NULL on neutral_auc, near raw VAD's +0.02 and the unwhitened
  # residual's +0.07 rather than the per-class target's +1.33.
  #
  # Reasoning. With one pooled matrix the target is r = W(v - mu_c) = Wv -
  # W mu_c, a single linear map of VAD plus a per-class constant. Given the
  # class it is affine in VAD, and the head ends in a bare Linear that can
  # absorb both the map and the constant, so it poses nearly the same learning
  # problem as regressing raw VAD. Per-class whitening instead applies a
  # DIFFERENT linear map per class (the matrices differ by up to 49 percent,
  # happy against angry, condition numbers 5.7 to 8.6), which no single linear
  # function of VAD can reproduce.
  #
  # That makes the ladder a single statement rather than a list: every target
  # that is affine in VAD given the class is null (raw VAD +0.02, unwhitened
  # residual +0.07), and the only one that works is the one that is not. A
  # confirmed null here answers "is the target just VAD in disguise" with four
  # rungs instead of two. A non-null result would falsify the account and is
  # the more interesting outcome.
  - <<: *template
    name: "wsh_res"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: true
    proto_whiten_scope: "shared"
    class_weight_mode: "sqrt_inverse_freq"

  # Anneal the auxiliary weight to zero over a 16-epoch budget, decaying
  # across the last six. Training on IEMOCAP showed the objective competes
  # with the main task (train UAR 5.5 points below baseline at epoch 8); on
  # MSP-Podcast the same gap is 1.25 points. If the head helps by shaping the
  # encoder early and only costs capacity later, annealing keeps the benefit
  # and drops the cost. The longer budget gives the schedule room: the head is
  # at full weight for ten epochs rather than five. It also makes the SWA
  # window pure main-task, so a surviving gain cannot be a late-training
  # calibration nudge.
  #
  # Compare against ep16_base, NOT against the 8-epoch baseline: MSP-Podcast
  # validation plateaus by epoch 5 to 7 and the baseline overfits harder with
  # a longer budget, so an 8-epoch reference would flatter this arm.
  - <<: *template
    name: "anneal16_res"
    num_epochs: 16
    swa_last_n: 6
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: true
    proto_predictor_anneal_epochs: 6
    class_weight_mode: "sqrt_inverse_freq"

  # Whitened residual plus class-whitened annotator dispersion, six outputs.
  # THE POINT: every other target in this file is a deterministic function of
  # (VAD, label) and so cannot carry more information than (VAD, label)
  # already does. The whitened residual works by presenting that information
  # in class-comparable units, not by adding to it, which is why the dose
  # response is flat across 8x, why 1-residual reproduces it exactly, and why
  # no reshaping tried so far has beaten it. Annotator dispersion is the first
  # component that is NOT recoverable from the consensus rating or the label:
  # two utterances with identical consensus VAD can have had very different
  # rater agreement. This raises the information ceiling instead of
  # rearranging what sits under it.
  #
  # Kept in the same class-whitened coordinates so both halves share units and
  # the class-conditional structure the ladder shows is load-bearing.
  #
  # Prior art to distinguish in the paper: Eyben et al. 2012 use inter-rater
  # standard deviation as an MTL target, but as the whole target on a
  # dimensional main task. Here it is dispersion in class-normalised
  # coordinates alongside the residual, under a categorical main task.
  - <<: *template
    name: "resdisp_res"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: true
    proto_target: "resdisp"
    class_weight_mode: "sqrt_inverse_freq"

  # Precision-weighted residual: r = W_c (v - mu_c) / (1 + s), per axis, where
  # s is the annotator dispersion on that axis. Roughly 29 percent of
  # within-class VAD spread is annotator measurement noise (results log,
  # section 4), and the plain residual cannot separate a genuinely atypical
  # speaker from raters who could not agree. Dividing by dispersion shrinks
  # the second case so the magnitude means RELIABLY atypical.
  #
  # This modulates the working target rather than widening it, which is the
  # lesson from resdisp: appending dispersion as three extra outputs lost 1.83
  # UAR against the placebo, because dispersion is apparently not recoverable
  # from audio and text AND a standard deviation carries no direction, the
  # same defect that made the scalar protoscore null. Here dispersion is never
  # predicted and all three signed components survive.
  #
  # Expectation: a modest change, not a breakthrough. The new target
  # correlates 0.96 per axis with the plain residual and preserves sign on
  # 100 percent of entries, with rank correlation 0.93 on magnitude. Its sd
  # falls from 1.00 to 0.65, which acts like a lower loss weight, though the
  # dose response was flat from 0.25 to 2.0 so that alone should not matter.
  #
  # Distinct from the prior art: Kim and Provost 2015 weight the LOSS by
  # agreement, Eyben et al. 2012 predict rater std AS a target. Weighting the
  # target's magnitude by rater precision is neither.
  - <<: *template
    name: "presid_res"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: true
    proto_target: "presidual"
    class_weight_mode: "sqrt_inverse_freq"

  # Prototypicality residual PLUS the aux VAD subtype-cluster head, together.
  # Two independent heads with independent losses (train.py:1250 and the
  # proto_predictor branch), weighted 1.0 and 0.2, so the cluster head takes
  # about a fifth of the auxiliary gradient rather than half. That asymmetry
  # is the point: resdisp failed partly because the added component carried
  # 54 percent of the target variance and diluted the half that works.
  #
  # Why this is the best remaining candidate. A cluster assignment is an
  # argmin over per-class VAD centroids, so it is DISCRETE and NOT affine in
  # VAD given the class. Every null so far has been affine in VAD given the
  # class (raw VAD +0.02, unwhitened residual +0.07, shared whitening
  # predicted null); this is the only untested target that fails that
  # description. It is also complementary in form: the residual is continuous
  # and directional, "where within your class", the cluster is discrete and
  # categorical, "which subtype of your class".
  #
  # Caveats recorded before running. The earlier belief that aux VAD
  # clustering helps rests on arms that predate the neutral_auc metric and sit
  # at a different configuration (IEMOCAP UAR 58 to 59 against the current
  # 60.2), so it is not established at the headline setting. And the pair of
  # arms that appeared to test cluster-plus-proto, auxvad_MSPP_on and
  # auxvad_MSPP_on_proto, are byte-identical results files: that comparison
  # was a run against itself and the combination has never actually been run.
  # A cluster id also discards direction within the cluster, the defect that
  # made the scalar protoscore null.
  - <<: *template
    name: "protoclust_res"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: true
    use_aux_vad_cluster: true
    aux_vad_task: "cluster"
    aux_vad_cluster_scope: "per_class"
    aux_vad_clusters_per_class: 2
    aux_vad_cluster_weight: 0.2
    class_weight_mode: "sqrt_inverse_freq"

  # === Speaker-disjoint validation block ================================
  # Two purposes. First, measure whether a speaker-independent validation
  # score predicts cross-corpus transfer, which the leaky class-stratified
  # split does not: across 28 runs its val UAR correlates +0.17 with IEMOCAP
  # UAR, -0.35 with SAMSEMO, and -0.45 within the baseline arm across seeds.
  # If the speaker-disjoint version correlates, it becomes a usable selection
  # and tuning signal and the headline should be rerun on it. If it does not,
  # the unfreeze comparison is repeated on the random split instead.
  # Second, test 4/4 unfreezing, which has never been run: uf_a4 and uf_ab4
  # exist in configs/unfreeze_screen.yaml at zero completed runs, so every
  # result in this project is 2/2 or shallower.
  #
  # These arms are NOT comparable to the cw_sqrt_* headline, which used the
  # class-stratified random split and therefore trained on different rows.
  # The 2/2 block below is the reference for the 4/4 block.
  - <<: *template
    name: "sv_base"
    val_split_by_speaker: true
    trace_test_each_epoch: true
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: false
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "sv_ctrl"
    val_split_by_speaker: true
    trace_test_each_epoch: true
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: true
    proto_predictor_shuffle: true
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "sv_res"
    val_split_by_speaker: true
    trace_test_each_epoch: true
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: true
    class_weight_mode: "sqrt_inverse_freq"

  # 4/4 unfreezing. Roughly doubles the trainable parameters in both
  # encoders, so watch VRAM: 2/2 sits at about 8 GB of 24 with gradient
  # checkpointing on. If this runs out of memory the fix is grad accumulation,
  # not a smaller batch, because batch size changes the comparison.
  - <<: *template
    name: "sv4_base"
    val_split_by_speaker: true
    trace_test_each_epoch: true
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: false
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "sv4_ctrl"
    val_split_by_speaker: true
    trace_test_each_epoch: true
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: true
    proto_predictor_shuffle: true
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "sv4_res"
    val_split_by_speaker: true
    trace_test_each_epoch: true
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: true
    class_weight_mode: "sqrt_inverse_freq"

  # Random-split twins of sv_base and sv_res, with the same per-epoch test
  # trace. Without these there is nothing to compare the speaker-disjoint
  # correlation against: a correlation of, say, 0.4 means little unless the
  # leaky split scores lower on identical runs. Same seeds, same everything
  # else, so the only difference is how the 25 percent is chosen.
  - <<: *template
    name: "rv_base"
    trace_test_each_epoch: true
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: false
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "rv_res"
    trace_test_each_epoch: true
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: true
    class_weight_mode: "sqrt_inverse_freq"

  # Four more seeds for shared whitening, to sit alongside the five-seed
  # per-class arm. Seed 42 is not repeated; the runner has no skip-completed
  # logic.
  #
  # Why this matters: at seed 42 shared whitening reached +1.40 AUCneu against
  # the baseline where per-class reached +1.54, a gap of 0.14 against a
  # seed-noise sd of 0.47, while raw VAD managed +0.48 and the unwhitened
  # residual +0.29. That FALSIFIES the prediction registered above, which
  # expected shared whitening to be null because W(v - mu_c) = Wv - W mu_c is
  # affine in VAD given the class. It is not null, so class-conditionality is
  # not what makes the target work; the covariance rescaling is, and a single
  # pooled matrix captures nearly all of it.
  #
  # Read with care: seed 42 flatters every arm on IEMOCAP. Raw VAD shows +0.48
  # at this seed against a five-seed mean of +0.02, and the unwhitened
  # residual +0.29 against +0.07. Only multi-seed numbers can settle where
  # shared whitening sits.
  - <<: *template
    name: "wsh_res_more"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [189, 7, 1234, 2024]
    use_proto_predictor: true
    proto_whiten_scope: "shared"
    class_weight_mode: "sqrt_inverse_freq"

  # 4/4 unfreezing on the random split, so it pairs against the cw_sqrt_*
  # headline rather than the speaker-disjoint arms. The speaker-split version
  # (sv4_*) showed AUCneu essentially unchanged by depth, +1.05 at 2/2 against
  # +1.07 at 4/4, and only about +0.2 UAR on absolute performance for 40 percent
  # more compute. This repeats that on the configuration the paper reports.
  #
  # VRAM measured at 2.97 GiB peak, batch 16, 6s audio, with gradient
  # checkpointing on both encoders. 89.8M trainable of 235.8M.
  - <<: *template
    name: "uf4_base"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: false
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "uf4_res"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: true
    class_weight_mode: "sqrt_inverse_freq"

  # Anneal the auxiliary weight to zero over the last three of eight epochs.
  # Tests whether the head's COST is a timing effect. The permuted control
  # costs 0.3 to 0.9 accuracy on every corpus (IEMOCAP -0.43, SAMSEMO -0.28,
  # MSP-Improv -0.85, CMU-MOSEI -0.62), which can only be gradient noise into
  # the shared trunk since its target carries no information. If that cost is
  # incurred late, switching the head off for the final epochs should recover
  # accuracy while keeping whatever the target shaped early. It also makes the
  # SWA window (last 3 epochs) pure main-task, so a surviving gain cannot be a
  # late-training calibration artifact.
  - <<: *template
    name: "anneal8_res"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: true
    proto_predictor_anneal_epochs: 3
    class_weight_mode: "sqrt_inverse_freq"

  # PCGrad gradient surgery on the auxiliary loss. Same target as cw_sqrt_res;
  # only how its gradient reaches the shared trunk changes. Where the
  # auxiliary and classification gradients conflict, the auxiliary one is
  # projected onto the orthogonal complement of the main gradient, so it can
  # only move the representation in directions that do not oppose
  # classification.
  #
  # Motivation: the permuted control costs 0.3 to 0.9 accuracy on every corpus
  # (IEMOCAP -0.43, SAMSEMO -0.28, MSP-Improv -0.85, CMU-MOSEI -0.62). Its
  # target carries no information, so that cost is interference and nothing
  # else. If interference is what the head charges, removing the conflicting
  # component should recover accuracy while keeping the boundary effect.
  #
  # Costs one extra backward pass over the trunk per step, so expect roughly
  # 1.5x the wall time.
  - <<: *template
    name: "pcgrad_res"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: true
    proto_pcgrad: true
    class_weight_mode: "sqrt_inverse_freq"

  # Four more PCGrad seeds. Seed 42 is not repeated.
  #
  # Seed-42 read, for context: PCGrad was WORSE than the plain residual on
  # IEMOCAP (AUCneu +1.42 against +1.54, accuracy +0.09 against +0.40) and
  # better on SAMSEMO (best arm on all four metrics, but every margin under
  # 0.35). It still beats the baseline everywhere, so this is not a failure,
  # it is an absence of improvement.
  #
  # The reason to run it at five seeds is not to find a better arm but to
  # support a robustness sentence: removing the conflicting component of the
  # auxiliary gradient does not change the effect, so the mechanism is not an
  # artefact of gradient interference with the classification loss. Together
  # with the annealing null, that closes the two obvious "the head is just
  # perturbing optimisation" objections.
  #
  # Costs one extra backward pass per step, about 2.8 h per seed against 2.5.
  - <<: *template
    name: "pcgrad_res_more"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [189, 7, 1234, 2024]
    use_proto_predictor: true
    proto_pcgrad: true
    class_weight_mode: "sqrt_inverse_freq"

  # Four more seeds for the 4/4 unfrozen pair. Seed 42 is not repeated.
  #
  # At seed 42 this is the only change in a week that moved every metric on
  # both reported corpora in the right direction at once. res-base went from
  # +0.40 to +1.27 accuracy and +1.54 to +1.64 AUCneu on IEMOCAP, and from
  # -0.06 to +0.44 accuracy and +0.12 to +0.51 AUCneu on SAMSEMO.
  #
  # It is not simply more capacity helping. The 4/4 BASELINE is slightly worse
  # than the 2/2 baseline (IEMOCAP accuracy 62.78 against 63.18), so the extra
  # unfrozen layers do not help on their own; the auxiliary head is what uses
  # them. That also reframes the accuracy cost: annealing and PCGrad both
  # failed to remove it at 2/2, and here it disappears without either.
  #
  # One seed, so this is a lead. Four more decide whether it is real.
  - <<: *template
    name: "uf4_base_more"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [189, 7, 1234, 2024]
    use_proto_predictor: false
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "uf4_res_more"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [189, 7, 1234, 2024]
    use_proto_predictor: true
    class_weight_mode: "sqrt_inverse_freq"

  # Full unfreeze, one seed. emotion2vec has 8 blocks and BERT 12, so 8/12 is
  # everything: 174.8M trainable of 235.8M, against 89.8M at 4/4 and 61.4M at
  # 2/2.
  #
  # Why: 2/2 to 4/4 improved res-base on every metric on both reported corpora
  # (IEMOCAP accuracy -0.14 to +0.87, UAR +0.74 to +1.17, AUCneu +1.61 to
  # +1.84 over two paired seeds). Whether that continues is unknown; 174.8M
  # trainable parameters against roughly 60k training rows could equally
  # overfit. One seed decides whether the direction is worth pursuing.
  #
  # VRAM: the 4/4 job runs at about 9 GB of 24 with gradient checkpointing on
  # both encoders and a measured 2.97 GiB activation peak. Doubling trainable
  # parameters adds roughly 1 GB of gradients and optimiser state plus a few
  # GB of activations, so this should land near 13 to 14 GB. If it OOMs the
  # fix is more gradient accumulation, not a smaller batch, because batch size
  # changes the comparison.
  - <<: *template
    name: "uf8_base"
    unfreeze_audio_layers: 8
    unfreeze_bert_layers: 12
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: false
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "uf8_res"
    unfreeze_audio_layers: 8
    unfreeze_bert_layers: 12
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: true
    class_weight_mode: "sqrt_inverse_freq"

  # Capacity-matched control at 4/4. Required if 4/4 becomes the headline
  # configuration: every 4/4 number so far is res-base, while the paper's
  # claim is res-ctrl. Identical to uf4_res except proto_predictor_shuffle,
  # which permutes the auxiliary target within the batch, so the head, its
  # parameter count, its gradient path and its target marginal are unchanged
  # and only the sample-to-target pairing is destroyed.
  - <<: *template
    name: "uf4_ctrl"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7, 1234, 2024]
    use_proto_predictor: true
    proto_predictor_shuffle: true
    class_weight_mode: "sqrt_inverse_freq"

  # Auxiliary VAD subtype clustering on its own, as a comparison point for the
  # paper's table. This is the separate aux_vad_cluster mechanism, not the
  # proto predictor: a discrete head predicting which of two per-class KMeans
  # VAD centroids a sample is nearest, at weight 0.2.
  #
  # It belongs in the comparison because it is the closest thing in this
  # project to a prior approach, and because a cluster assignment is an argmin
  # over per-class centroids, so it is discrete and NOT affine in VAD given
  # the class. That distinguishes it from raw VAD regression, which is already
  # in the table as sens_rawvad_res and is null (+0.02 AUCneu at five seeds).
  #
  # Note the earlier belief that this mechanism helps rests on runs that
  # predate the neutral_auc metric and sit at a different configuration, and
  # the arms that appeared to test it combined with the proto head
  # (auxvad_MSPP_on and auxvad_MSPP_on_proto) are byte-identical results
  # files. This is its first clean measurement at the headline setting.
  - <<: *template
    name: "auxvad_only"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7, 1234, 2024]
    use_proto_predictor: false
    use_aux_vad_cluster: true
    aux_vad_task: "cluster"
    aux_vad_cluster_scope: "per_class"
    aux_vad_clusters_per_class: 2
    aux_vad_cluster_weight: 0.2
    class_weight_mode: "sqrt_inverse_freq"

  # Alternative control constructions, one seed each, to show the result does
  # not depend on how the control target is built.
  #
  # The default control permutes within the batch. Two cosmetic objections:
  # a random permutation has exactly one fixed point in expectation whatever
  # its size, so about 6 percent of samples at batch 16 receive their own
  # target; and batches are length-bucketed rather than random. The second was
  # measured and does not bite here (duration against residual magnitude
  # correlates -0.031, and mean duration varies 5.58 to 5.76 seconds across the
  # four classes), but both go away below.
  #
  # "pool" draws each control target uniformly from the training split's own
  # residuals: no fixed points (self-collision probability 1.2e-05 per sample),
  # no dependence on batch composition, same marginal.
  - <<: *template
    name: "ctrl_pool"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: true
    proto_predictor_shuffle: true
    proto_shuffle_mode: "pool"
    class_weight_mode: "sqrt_inverse_freq"

  # "gauss" draws from a Gaussian matched to the pool's mean and covariance,
  # so no real row is reused at all. Independent of the pool construction, so
  # agreement between the three is evidence about the control design rather
  # than about one particular way of scrambling.
  - <<: *template
    name: "ctrl_gauss"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: true
    proto_predictor_shuffle: true
    proto_shuffle_mode: "gauss"
    class_weight_mode: "sqrt_inverse_freq"

  # Annotator agreement AS the auxiliary target, at 4/4. This is the direct
  # comparison against the closest prior art: Kim and Provost (ACII 2015)
  # define prototypicality as annotator agreement, weight IEMOCAP four-class
  # training by it, and find the gain concentrated on neutral. Running their
  # quantity through our head makes the distinction empirical.
  #
  # Prediction, registered before the run: this should do LESS than the
  # whitened residual, for two independent reasons. It is a scalar, and every
  # scalar target tried in this project has been null (protoscore discards
  # direction and does nothing) while the direction-preserving three-vector
  # works. And it measures something nearly orthogonal to our target: across
  # 80,941 training rows, class agreement correlates +0.027 with Mahalanobis
  # atypicality, with per-axis signed correlations at most 0.086.
  #
  # Run at 4/4 so it pairs against uf4_base and uf4_ctrl, which have four
  # seeds each. If the headline stays at 2/2 this should be repeated there;
  # it is cheaper (2.5 h against 3.7 h per seed).
  - <<: *template
    name: "uf4_agree"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    proto_target: "agreement"
    class_weight_mode: "sqrt_inverse_freq"

  # Four more seeds for the pool-draw control, so it can serve as the PRIMARY
  # control rather than a robustness check. Seed 42 is not repeated.
  #
  # Chosen on design, not on margin: a within-batch permutation has exactly one
  # fixed point in expectation whatever the batch size, so about 6 percent of
  # samples at batch 16 are handed their own target and the control is that
  # much informative by construction. Drawing from the training split's
  # residual pool removes it entirely (self-collision probability 1.2e-05 per
  # sample) and does not depend on batch composition.
  #
  # The batch-permutation control keeps its five seeds and moves to the
  # appendix, so the paper can state the result under both constructions.
  - <<: *template
    name: "ctrl_pool_more"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [189, 7, 1234, 2024]
    use_proto_predictor: true
    proto_predictor_shuffle: true
    proto_shuffle_mode: "pool"
    class_weight_mode: "sqrt_inverse_freq"

  # Complete the ablation ladder to five seeds. raw VAD and the per-class
  # residual already have five; the unwhitened residual has three and shared
  # whitening two of four. A uniform seed count matters here because the
  # ladder is the paper's mechanism argument, and a reader comparing +0.07
  # (n=3) against +1.33 (n=5) is entitled to ask whether the seed sets differ.
  #
  # wsh_res_more already covers 1234 and 2024 and the launcher keeps completed
  # seeds, so rerunning that arm fills only what is missing.
  - <<: *template
    name: "sens_euclid_res_more"
    unfreeze_audio_layers: 2
    unfreeze_bert_layers: 2
    bert_learning_rate: 5e-6
    seeds: [1234, 2024]
    use_proto_predictor: true
    proto_metric: "euclidean"
    class_weight_mode: "sqrt_inverse_freq"

  # Ablation ladder at 4/4, to match uf4_base / uf4_ctrl / uf4_res. Three
  # seeds each: the two rungs that carry the mechanism argument are raw VAD
  # (shows the effect is not VAD multi-task learning) and the unwhitened
  # residual (shows the covariance scaling is what matters). Shared whitening
  # is omitted at this depth; it matched per-class at 2/2 (+1.40 against
  # +1.46 AUCneu) and is a secondary point.
  - <<: *template
    name: "uf4_rawvad"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    proto_target: "rawvad"
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "uf4_euclid"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    proto_metric: "euclidean"
    class_weight_mode: "sqrt_inverse_freq"

  # Pool-draw control at 4/4. uf4_ctrl uses the within-batch permutation,
  # which hands about 6 percent of samples their own target. If 4/4 is the
  # headline, its control should be the leak-free one for the same reason the
  # 2/2 control was switched.
  - <<: *template
    name: "uf4_ctrl_pool"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7, 1234, 2024]
    use_proto_predictor: true
    proto_predictor_shuffle: true
    proto_shuffle_mode: "pool"
    class_weight_mode: "sqrt_inverse_freq"

  # Aux VAD subtype clustering at 4/4, as the comparison point for the paper's
  # table. Moved from 2/2 now that 4/4 is the headline configuration.
  - <<: *template
    name: "uf4_auxvad"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: false
    use_aux_vad_cluster: true
    aux_vad_task: "cluster"
    aux_vad_cluster_scope: "per_class"
    aux_vad_clusters_per_class: 2
    aux_vad_cluster_weight: 0.2
    class_weight_mode: "sqrt_inverse_freq"

  # Inter-rater standard deviation as the auxiliary target, the Eyben et al.
  # 2012 signal, isolated. resdisp tested it concatenated with the residual
  # and lost 1.83 UAR against the control, but that confounds "dispersion does
  # not help" with "dispersion dilutes a target that works". Three dims, same
  # head and weight as every other arm.
  - <<: *template
    name: "uf4_disp"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    proto_target: "dispersion"
    class_weight_mode: "sqrt_inverse_freq"

  # Secondary-label target: where the annotators who did NOT vote the majority
  # class went instead. The four-class vote distribution with the sample's own
  # class zeroed and renormalised.
  #
  # 85.9 percent of MSP-Podcast clips have a nonzero runner-up class, with a
  # mean runner-up mass of 0.215, so this is a well-populated signal rather
  # than a sparse one.
  #
  # Distinct from soft-label training (Ando et al. 2018) and from label
  # smoothing: removing the true-class mass leaves a target carrying no
  # information about the label itself, only about the DIRECTION of
  # disagreement. Its neutral component supervises the neutral boundary
  # directly rather than inferring it through VAD geometry, which makes it the
  # closest competitor to the residual on the paper's own terms.
  - <<: *template
    name: "uf4_offlabel"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    proto_target: "offlabel"
    class_weight_mode: "sqrt_inverse_freq"

  # Seed 2024 for the batch-permutation control at 4/4. That arm stopped at
  # four seeds when the disk filled. One more takes SAMSEMO UAR res-ctrl from
  # t=3.07 against a critical 3.18 at n=4 to significance at n=5, which is the
  # cheapest significant cell available anywhere in this project.
  - <<: *template
    name: "uf4_ctrl_s2024"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [2024]
    use_proto_predictor: true
    proto_predictor_shuffle: true
    class_weight_mode: "sqrt_inverse_freq"

  # Three further seeds on base and control only, to firm up the capacity
  # claim. That claim -- an auxiliary head with an unlearnable target gains
  # about half a UAR point at 4/4 -- currently rests on IEMOCAP UAR ctrl-base
  # at t=3.21 against a critical 3.18, significant by 0.03. On AUCneu it would
  # need 19 seeds and on SAMSEMO 21, so those stay descriptive, but doubling
  # the IEMOCAP UAR sample roughly halves its interval.
  #
  # The residual arm is NOT rerun: ctrl-base does not involve it.
  - <<: *template
    name: "uf4_base_x3"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [31337, 2718, 1618]
    use_proto_predictor: false
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "uf4_ctrl_x3"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [31337, 2718, 1618]
    use_proto_predictor: true
    proto_predictor_shuffle: true
    class_weight_mode: "sqrt_inverse_freq"

  # Seeds 1234 and 2024 for each comparison arm, taking the auxiliary-target
  # table to five seeds throughout. At three seeds the critical t is 4.303,
  # so those rows could show a large difference from ours but could not
  # establish a null; at five it drops to 2.776. Since the table is the
  # paper's central exhibit, a uniform seed count across rows also removes the
  # question of whether the comparisons were given a fair chance.
  - <<: *template
    name: "uf4_rawvad_more"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [1234, 2024]
    use_proto_predictor: true
    proto_target: "rawvad"
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "uf4_agree_more"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [1234, 2024]
    use_proto_predictor: true
    proto_target: "agreement"
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "uf4_disp_more"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [1234, 2024]
    use_proto_predictor: true
    proto_target: "dispersion"
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "uf4_offlabel_more"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [1234, 2024]
    use_proto_predictor: true
    proto_target: "offlabel"
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "uf4_auxvad_more"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [1234, 2024]
    use_proto_predictor: false
    use_aux_vad_cluster: true
    aux_vad_task: "cluster"
    aux_vad_cluster_scope: "per_class"
    aux_vad_clusters_per_class: 2
    aux_vad_cluster_weight: 0.2
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "uf4_euclid_more"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [1234, 2024]
    use_proto_predictor: true
    proto_metric: "euclidean"
    class_weight_mode: "sqrt_inverse_freq"

  # --- Residual variants ---------------------------------------------------
  # Symmetric whitening instead of the Cholesky factor. Both satisfy
  # W W^T = inv(cov) and give the same Mahalanobis norm, so this changes only
  # the three components the head regresses, which differ by 0.267 on average.
  # Cholesky is triangular, so its components depend on the order the VAD axes
  # are listed in: the last is a scaled dominance alone while the first mixes
  # all three. The symmetric root treats the axes evenly. A reviewer can
  # reasonably ask whether that asymmetry matters; this answers it.
  - <<: *template
    name: "uf4_symw"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    proto_whiten_form: "symmetric"
    class_weight_mode: "sqrt_inverse_freq"

  # Signed decomposition, computed AFTER whitening so it is compared with the
  # whitened residual on equal terms. Two outputs: a signed coordinate along
  # the class's own direction away from neutral, and the magnitude of what is
  # left. The motivation is that a Mahalanobis norm scores "more angry than
  # the average angry" and "drifting toward neutral" as equally atypical, when
  # only the second is near the neutral boundary this paper reports on.
  #
  # KNOWN DEFECT, recorded before running: for the neutral class the axis
  # mu_c - mu_neutral is zero, so the along component is identically zero and
  # those samples fall back to a pure magnitude. That is 38 percent of the
  # training split on a degenerate target, and a magnitude-only target is what
  # made protoscore null. If this arm underperforms, that is the first
  # explanation to check, not the decomposition itself.
  - <<: *template
    name: "uf4_signedw"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    proto_target: "signedw"
    class_weight_mode: "sqrt_inverse_freq"

  # ABLATION: is the whitening required to be class-conditional?
  #
  # One pooled whitening matrix shared by every class, instead of L_c per
  # class. The target stays centred on the sample's own class mean, so
  # "relative to your own prototype" survives; what goes is the claim that
  # each class needs its own coordinate system. A 3-seed observation at a
  # different depth put shared at +1.40 against per-class +1.46, inside seed
  # noise, which would mean the rescaling matters and the class-conditionality
  # does not. This promotes that observation to the reported configuration at
  # the same five seeds as uf4_res so the two are paired.
  - <<: *template
    name: "uf4_shared"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7, 1234, 2024]
    use_proto_predictor: true
    proto_whiten_scope: "shared"
    class_weight_mode: "sqrt_inverse_freq"

  # ABLATION: is the direction required, or only the magnitude?
  #
  # The scalar Mahalanobis distance ||L_c^T (v - mu_c)||, so the head predicts
  # how atypical a sample is without predicting in which direction. This is
  # the rung the comparison table has no answer for. Held-out analysis found
  # magnitude alone already tracks the baseline's difficulty (Spearman +0.148
  # against the true-label loss, and a coefficient of +0.336 in a joint model
  # beside annotator disagreement's +0.434), so a scalar target may carry most
  # of the effect. If it does, the claim simplifies to class-relative
  # atypicality and the three-vector is unnecessary; if it does not, direction
  # is load-bearing and the vector form is justified. Either outcome is
  # reportable, which is why this arm is worth five seeds.
  #
  # Note the head is Linear(1024, 1) here against Linear(1024, 3) for uf4_res
  # and the controls (proto_predictor_hidden_dim is 0, so the head is a bare
  # linear map), so this arm is 2,050 parameters lighter. That is 2e-5 of the
  # 89.8M trainable and cannot carry a result, but it does mean this rung is
  # not capacity matched to the same tolerance as the permuted control.
  # NOTE lambda 1.71 = 1/Var(||r||), matching res's effective auxiliary weight.
  # At the default 1.0 this arm would have run at 0.593x, which is how the
  # earlier magnitude-only evidence (ar_abs, +0.31 at 2/2) was produced: never
  # a fair test of whether direction matters.
  #
  # This is the one salvage path for prototypicality as a TARGET. ||L_c^T(v -
  # mu_c)|| is a norm, so not an affine function of VAD, and it is
  # class-conditional in a way a linear head reading globally standardised VAD
  # cannot compute. If it works at matched weight, whitevad cannot substitute
  # for it and the class-relative construction is irreducible after all.
  - <<: *template
    name: "uf4_mahal"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    proto_target: "scalar"
    proto_metric: "mahalanobis"
    proto_predictor_weight: 1.71
    class_weight_mode: "sqrt_inverse_freq"

  # CONTROL: is it class-relativity, or just a better-conditioned target?
  #
  # Whitening applied to raw VAD using the GLOBAL mean and the MARGINAL
  # covariance, with no class information anywhere in the transform. The map
  # v -> W(v - mu) is affine and invertible, so this target carries exactly
  # the information uf4_rawvad carries; only the conditioning changes, with
  # the three axes decorrelated and put on a common scale.
  #
  # This closes the one gap the ladder cannot currently answer. uf4_res
  # differs from uf4_rawvad in two ways at once, class-relative centering AND
  # conditioning, so a reviewer can argue the gain is only that MSE on raw
  # VAD weights three correlated axes of unequal scale unevenly. uf4_euclid
  # does not settle it either, since it is centred as well as unconditioned.
  #
  # Reading: if this matches uf4_rawvad (+0.29 IEMOCAP AUCneu, +0.04 SAMSEMO
  # UAR against the permuted control), conditioning explains nothing and the
  # rescaling works only in combination with class-relative centering. If it
  # matches uf4_res (+1.26, +1.00), the class-relative reading is wrong and
  # the paper's claim has to change.
  - <<: *template
    name: "uf4_whitevad"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7, 1234, 2024]
    use_proto_predictor: true
    proto_target: "whitevad"
    class_weight_mode: "sqrt_inverse_freq"

  # P0 CONTROL: is the gain decorrelation, or only target rescaling?
  #
  # Scale-matched centred residual. The class centroid is subtracted as
  # usual, then each coordinate is divided by its own within-class standard
  # deviation. That is diagonal scaling, not full whitening: the target has
  # unit variance per coordinate exactly like the whitened residual, but the
  # class ellipsoid keeps its tilt, with off-diagonal covariance mass of 1.98
  # against 0.015 for the full whitening.
  #
  # This completes the three-way separation the ladder needs:
  #
  #   arm            centred   unit scale   decorrelated
  #   uf4_euclid     yes       no           no
  #   uf4_scalematch yes       yes          no
  #   uf4_res        yes       yes          yes
  #
  # Whitened against scale-matched isolates the decorrelation step with scale
  # held fixed. Without it, uf4_res differs from uf4_euclid in two properties
  # at once and a reviewer can argue the whole effect is target rescaling,
  # which is the objection most likely to sink the paper.
  - <<: *template
    name: "uf4_scalematch"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7, 1234, 2024]
    use_proto_predictor: true
    proto_whiten_form: "diagonal"
    class_weight_mode: "sqrt_inverse_freq"

  # The headline configuration, rerun at one seed purely to capture the
  # auxiliary head's predictions on every split.
  #
  # The head is discarded after training and was never persisted, so no
  # existing run can say how well it actually fitted its target. This arm is
  # identical to uf4_res in every field; the only difference is that it runs
  # after the prediction dump learned to write aux_pred, the batch VAD and
  # the fitted class statistics, which together allow the target to be
  # reconstructed exactly offline and R2 computed per coordinate.
  #
  # IEMOCAP and MSP-Improv are the only evaluation corpora this can be
  # measured on. SAMSEMO and CMU-MOSEI carry no per-utterance VAD in this
  # build, so a residual is not defined for them.
  #
  # Runs first, so the new dump path is validated by a 2.8 hour job rather
  # than discovered to be broken after the 14 hour scale-matched arm.
  - <<: *template
    name: "uf4_res_aux"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: true
    class_weight_mode: "sqrt_inverse_freq"

  # Does the neutral residual carry anything, or is it incoherent?
  #
  # Identical to uf4_res except the auxiliary loss is masked on neutral rows.
  # The premise of the paper is that neutrality is the absence of emotion
  # rather than an emotion. If that is right, "atypical for neutral" has no
  # clear referent: a neutral utterance far from the neutral centroid is
  # drifting toward some emotion, but the whitened residual states that drift
  # in neutral's own coordinates and so says nothing about which emotion.
  # Neutral is 45 percent of the training pool, so that target dominates the
  # auxiliary gradient.
  #
  # Surviving weights are rescaled to mean one, so the auxiliary loss keeps
  # the same magnitude and proto_predictor_weight stays comparable.
  #
  # CAVEAT for interpretation: this arm draws auxiliary gradient from only
  # about 55 percent of rows, so its gradient-noise profile differs from
  # uf4_ctrl_pool and the pairing is not as clean as the other rungs. Read a
  # large win as worth a matched masked control, not as a finished result.
  - <<: *template
    name: "uf4_maskneu"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7, 1234, 2024]
    use_proto_predictor: true
    proto_skip_neutral: true
    class_weight_mode: "sqrt_inverse_freq"

  # Fit the class prototypes on high-agreement utterances only.
  #
  # Identical to uf4_res except the class means and covariances are estimated
  # from the top quartile of within-class annotator agreement rather than from
  # every row. The motivation is geometric: an utterance annotators split over
  # contributes a consensus VAD that summarises the disagreement rather than
  # measuring the emotion, so it blurs the prototype it is fitted into.
  #
  # Measured effect on the prototypes (q=0.75 against all samples):
  #   neutral-sad    0.165 -> 0.225   (+36 percent)
  #   neutral-happy  0.212 -> 0.224
  #   neutral-angry  0.354 -> 0.439
  #   sad-angry      0.395 -> 0.499
  # Sad sits closest to neutral, and the confusion analysis shows recovered
  # mass flooding into sad, so widening that specific gap is the targeted fix.
  # It also matters more now than when first proposed: uf4_scalematch showed
  # the effect is carried by per-axis rescaling, and consensus filtering
  # changes exactly the statistics that rescaling uses, the class mean and the
  # per-axis standard deviation.
  #
  # NOTE annot_consensus is the max of a 9-wide primary label distribution
  # (Neutral, Happy, Sad, Angry, Contempt, Surprise, Disgust, Fear, Other), so
  # the filter selects on agreement over the full taxonomy, not over the four
  # trained classes. 51 percent of utterances carry at least one off-taxonomy
  # vote.
  #
  # Prior evidence is weak and mildly unfavourable: cc_class at 2/2 scored
  # 80.32 IEMOCAP AUCneu against us_res at 80.78, but on a different seed,
  # unpaired, one run each.
  - <<: *template
    name: "uf4_cons"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7, 1234, 2024]
    use_proto_predictor: true
    proto_centroid_consensus_q: 0.75
    proto_consensus_source: "class"
    class_weight_mode: "sqrt_inverse_freq"

  # Class-balance the auxiliary loss instead of masking neutral out of it.
  #
  # Identical to uf4_res except each row's auxiliary MSE is weighted by the
  # same class weights the classifier already uses (sqrt inverse frequency),
  # renormalised to mean one per batch so the loss magnitude and
  # proto_predictor_weight stay comparable.
  #
  # Motivation comes from uf4_maskneu. Neutral is 45 percent of the pool and
  # dominates the auxiliary gradient by count, so masking it was the obvious
  # fix; at three seeds that overshot, losing half the IEMOCAP neutral-AUC
  # gain (+0.67 against +1.23), which says the neutral residual does carry
  # information. Masking also handed 52 percent of the auxiliary gradient to
  # happy, the one class where the residual arm already loses AUC.
  #
  # Share of the auxiliary gradient per class:
  #   unweighted      N 45.3  H 28.5  S 10.7  A 15.5
  #   class-balanced  N 34.9  H 27.7  S 16.9  A 20.4
  #   masked          N  0.0  H 52.1  S 19.5  A 28.4
  # The balanced version trims neutral without removing it and lifts sad from
  # 10.7 to 16.9, which is the class the effect concentrates in.
  #
  # No new hyperparameter: the weights are the classifier's own.
  - <<: *template
    name: "uf4_clsbal"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7, 1234, 2024]
    use_proto_predictor: true
    proto_class_balanced: true
    class_weight_mode: "sqrt_inverse_freq"

  # Five ADDITIONAL seeds for the two headline arms, taking the four headline
  # contrasts to ten paired seeds while every exploratory arm stays at five.
  #
  # The motivating number is SAMSEMO UAR. The effect is +0.95 and the minimum
  # detectable effect at five seeds, computed from the observed seed-to-seed
  # variance, is also 0.95: the weakest headline result sits exactly on its
  # own detection floor. Ten seeds drops that floor to about 0.56.
  #
  # Seeds are fixed here before any of these runs execute, and are distinct
  # from the original five (7, 42, 189, 1234, 2024). They are not chosen with
  # reference to any result.
  #
  # These run with gradient checkpointing off, which was verified bitwise
  # identical to on, so they pool with the original five without caveat.
  # Report the run counts explicitly: ten for base/control/residual contrasts,
  # five for the ablation and comparison arms, three for maskneu.
  - <<: *template
    name: "uf4_res_x2"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [13, 77, 256, 512, 2025]
    use_proto_predictor: true
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "uf4_ctrl_pool_x2"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [13, 77, 256, 512, 2025]
    use_proto_predictor: true
    proto_predictor_shuffle: true
    proto_shuffle_mode: "pool"
    class_weight_mode: "sqrt_inverse_freq"

  # Supervise the per-modality embeddings, not only the fused representation.
  #
  # The classifier reads the fused vector, so attaching the auxiliary target
  # only there lets the fusion layer satisfy the task without either encoder
  # having to encode prototypicality at all. This adds the same head, with the
  # same target, to the audio embedding (3072-d) and the text embedding
  # (768-d) as well. The three losses are averaged so the total auxiliary
  # magnitude is unchanged and proto_predictor_weight stays comparable.
  #
  # modal_features are returned attached rather than detached for this arm, so
  # gradient flows back into emotion2vec and BERT rather than stopping at the
  # heads.
  #
  # CAVEAT the arm carries three auxiliary heads where every other arm carries
  # one, so it is NOT capacity matched to uf4_ctrl_pool. A gain here cannot be
  # attributed to per-modality supervision until a matched control is run
  # (same three heads, shuffled targets).
  - <<: *template
    name: "uf4_modheads"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7, 1234, 2024]
    use_proto_predictor: true
    proto_modality_heads: true
    class_weight_mode: "sqrt_inverse_freq"

  # Scale-matched euclid: the clean resolution of the target-scale confound.
  #
  # Every arm sets proto_predictor_weight 1.0, but MSE scales with the
  # target's variance, and the targets differ by up to 65x:
  #   rawvad 0.0251, euclid 0.0152, scalematch 0.9929, res 0.9878.
  # So uf4_euclid's null (+0.17 IEMOCAP AUCneu) may reflect a nearly
  # switched-off auxiliary head rather than an uninformative target, and
  # "rescaling is the mechanism" is currently confounded with "euclid had 65x
  # less loss".
  #
  # This is uf4_euclid with lambda set to 1/0.0152 = 65.8, matching res's
  # effective auxiliary weight exactly. Identical target, identical geometry,
  # identical information; only the loss scale differs. Near +0.17 means the
  # null is real and the ablation ladder stands. A jump means it does not.
  - <<: *template
    name: "uf4_euclid_lam"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    proto_metric: "euclidean"
    proto_predictor_weight: 65.8
    class_weight_mode: "sqrt_inverse_freq"

  # ---- Parked for a follow-up paper; not needed for this submission ----

  # Matched control for uf4_maskneu: same masking, shuffled targets. Without
  # it, maskneu's gradient comes from ~55 percent of rows against the pool
  # control's 100, so its comparison is not capacity matched.
  - <<: *template
    name: "uf4_maskneu_ctrl"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    proto_skip_neutral: true
    proto_predictor_shuffle: true
    proto_shuffle_mode: "pool"
    class_weight_mode: "sqrt_inverse_freq"

  # Score the head only on within-class variation. The target's per-class mean
  # is zero by construction, yet the head predicts -0.29 to +0.26 and 8.5
  # percent of its output variance is class alone (26 percent on IEMOCAP).
  # Centring both sides per class removes that shortcut.
  - <<: *template
    name: "uf4_predcentre"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    proto_centre_pred: true
    class_weight_mode: "sqrt_inverse_freq"

  # Does a head that can actually fit the target transfer better, or does it
  # absorb the task? The linear head reaches R2 0.21 in domain and 0.10 across
  # corpora. A hidden layer fits better but weakens the pressure on the trunk,
  # which is the argument the linear head was chosen on.
  - <<: *template
    name: "uf4_widehead"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    proto_predictor_hidden_dim: 256
    class_weight_mode: "sqrt_inverse_freq"

  # Matched control for uf4_whitevad.
  #
  # uf4_ctrl_pool is already scale matched to whitevad (both targets have unit
  # sd), so the existing comparison is defensible. It is not an exact marginal
  # match: ctrl_pool draws from real residuals, which are heavier tailed than
  # globally whitened VAD (kurtosis 4.48 against 2.71 on component 0).
  #
  # This permutes whitevad's OWN targets, so the control's marginal is exactly
  # the arm's marginal. It uses batch rather than pool mode deliberately: the
  # pool is built from residual_targets, so pool mode would hand this arm real
  # residuals rather than whitened VAD. Batch permutation leaves about 6
  # percent fixed points, which measurement puts at 0.07 AUCneu against the
  # pool control, an acceptable cost for an exact marginal match.
  - <<: *template
    name: "uf4_whitevad_ctrl"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7, 1234, 2024]
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_shuffle: true
    proto_shuffle_mode: "batch"
    class_weight_mode: "sqrt_inverse_freq"

  # ---- Scale-matched comparison arms ----
  #
  # Every arm in the comparison table sets proto_predictor_weight 1.0, but MSE
  # scales with the target's variance, and the comparison targets are far
  # smaller than the residual:
  #
  #   agreement   0.0449   effective lambda 0.045x   (22x weaker than res)
  #   dispersion  0.1659   0.168x                    (6x weaker)
  #   offlabel    0.0998   0.101x                    (10x weaker)
  #   res         0.9878   1.000x
  #
  # So every null in that table was measured with the auxiliary head running
  # at a small fraction of the weight the residual arm had, and the conclusion
  # "annotator-derived targets do not transfer" is not yet supported. These
  # arms set lambda = 1/Var(target), which matches the effective auxiliary
  # weight exactly while leaving the target, its information and its geometry
  # untouched.
  #
  # Scale matching by lambda rather than by standardising the target keeps the
  # change config-only and avoids introducing a second difference; scalematch
  # already showed decorrelation contributes nothing, so per-axis whitening of
  # these targets would add a factor that is known not to matter.
  - <<: *template
    name: "uf4_agree_lam"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    proto_target: "agreement"
    proto_predictor_weight: 22.3
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "uf4_disp_lam"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    proto_target: "dispersion"
    proto_predictor_weight: 6.03
    class_weight_mode: "sqrt_inverse_freq"

  - <<: *template
    name: "uf4_offlabel_lam"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    proto_target: "offlabel"
    proto_predictor_weight: 10.0
    class_weight_mode: "sqrt_inverse_freq"

  # Prototypicality AND annotator agreement in one target.
  #
  # Q2 measured the two as independent routes to model difficulty: in a joint
  # logistic with class fixed effects, disagreement carries +0.434 and
  # residual magnitude +0.336, each surviving the other's presence, and the
  # two are near orthogonal within class (Spearman -0.003). Neither displaces
  # the other, so the pair may be worth more than either alone.
  #
  # Target is [whitened residual (3), standardised agreement (1)], both halves
  # at unit variance. The head widens from 3 to 4, so this arm is 1,025
  # parameters heavier than uf4_res and is not exactly capacity matched to
  # uf4_ctrl_pool; that is 1e-5 of the trainable total.
  #
  # This is deliberately NOT the existing resdisp kind, which uses dispersion
  # rather than agreement (inert in the joint model) and leaves that half
  # carrying 18.8x the residual half's weight.
  - <<: *template
    name: "uf4_resagree"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    proto_target: "resagree"
    class_weight_mode: "sqrt_inverse_freq"

  # Globally whitened VAD plus standardised agreement: the fourth cell.
  #
  # Crossing class-relative centring with annotator agreement:
  #
  #                       alone        + agreement
  #   no class centring   whitevad     vadagree
  #   class-relative      res          resagree
  #
  # resagree against res alone cannot say whether centring still contributes
  # once agreement is in the target; this arm can. It matters most if
  # whitevad turns out to match res, because then the question becomes
  # whether class-relative centring adds anything at all, at any point.
  #
  # Target is [globally whitened VAD (3), standardised agreement (1)], both
  # halves at unit variance. Head is 4 wide, matching resagree.
  - <<: *template
    name: "uf4_vadagree"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    proto_target: "vadagree"
    class_weight_mode: "sqrt_inverse_freq"

  # A fixed random target per utterance: learnable, but meaningless.
  #
  # The decisive test of the within-class-variance mechanism. Every existing
  # control redraws its target each batch, so the head can never fit it and
  # the trunk receives only noise; those gain +0.28 AUCneu. This target is
  # drawn once per utterance from N(0,1) and held fixed for all eight epochs,
  # so the head CAN fit it, but only by making the shared embedding keep
  # utterances individually distinguishable. That is exactly the within-class
  # spread cross-entropy collapses (control 0.72) and every helpful arm
  # restores (0.79 to 0.83).
  #
  # Reading: near +1.6 means the mechanism is preserving within-class geometry
  # and the emotional content of the target is irrelevant, which would be the
  # strongest and most surprising result in the project. Near +0.3 means
  # content matters and the regulariser reading is wrong.
  #
  # Unit covariance by construction, so the effective auxiliary weight matches
  # uf4_res. Head width identical. The only difference from uf4_res is what
  # the target means.
  - <<: *template
    name: "uf4_randfixed"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    proto_target: "randfixed"
    class_weight_mode: "sqrt_inverse_freq"

  # Prototypicality as a LOSS WEIGHT rather than a regression target.
  #
  # The whitened residual as an auxiliary target turned out to be redundant:
  # globally standardised VAD matches it to +0.02 (p=0.92) and moves exactly
  # the same errors (neutral precision identical to two decimals). That is
  # because the target is an affine function of VAD given the class, so a
  # plain VAD regression can express it.
  #
  # Weighting is categorically different. The per-sample CE weight
  # exp(alpha * ||L_c^T (v - mu_c)||) is a NORM, so it is not affine in VAD,
  # and no auxiliary regression head can implement it: it reweights the main
  # objective rather than adding a prediction. It is also the direct
  # expression of the paper's thesis, that atypical utterances are the ones
  # hard categorical labels fail on, so the model should learn more from them.
  #
  # The auxiliary head stays ON with the usual whitened residual target. The
  # weighting is applied ALONGSIDE it, so atypicality is used twice and in two
  # different ways: the head shapes the shared representation, the weight
  # decides how much each utterance contributes to the classifier. These are
  # different mechanisms, and only the second is beyond what a plain VAD
  # regression can express.
  #
  # Pairs against uf4_res, which is the same arm without the weighting, so the
  # comparison isolates the weighting alone.
  #
  # alpha 0.5, not the 2.0 default: that default was tuned for the Euclidean
  # distance to hardcoded centroids, which has a much smaller range. At 2.0
  # the Mahalanobis version puts 86 percent of the loss on 1 percent of rows.
  # At 0.5 the middle 80 percent of weights run 0.60 to 1.47.
  - <<: *template
    name: "uf4_res_ceatyp"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    use_prototypical_weighting: true
    ce_weight_source: "mahal"
    ce_weight_invert: true
    prototypical_weighting_alpha: 0.5
    class_weight_mode: "sqrt_inverse_freq"

  # The same, downweighting atypical rows instead. If atypical utterances are
  # noise rather than signal the sign should flip, and the pair brackets it.
  - <<: *template
    name: "uf4_res_ceproto"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    use_prototypical_weighting: true
    ce_weight_source: "mahal"
    ce_weight_invert: false
    prototypical_weighting_alpha: 0.5
    class_weight_mode: "sqrt_inverse_freq"

  # exp(-||r||): bounded prototypicality, 1 at the class centre decaying to 0.
  # Strongly nonlinear rather than merely non-affine, and it compresses the
  # long right tail that MSE on the raw distance over-weights. lambda 37.8 =
  # 1/Var, matching res; at the default 1.0 it ran at 0.027x, which makes its
  # 2/2 result of +1.10 the most under-weighted arm that still worked.
  - <<: *template
    name: "uf4_protoscore"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    use_proto_predictor: true
    proto_target: "protoscore"
    proto_metric: "mahalanobis"
    proto_predictor_weight: 37.8
    class_weight_mode: "sqrt_inverse_freq"

  # ---- VAD-trust weighting: confine the VAD target to rows VAD explains ----
  #
  # A Gaussian class-conditional VAD classifier fitted on MSP-Podcast and
  # transferred to IEMOCAP misclassifies 34.8 percent of that corpus. Scoring
  # every arm against its matched control on that split (see
  # analysis/vad_explained_split.py):
  #
  #   whitevad vs ctrl_pool   +0.85 explained *   -1.06 unexplained *
  #   res_more vs ctrl_pool   +0.55               -1.20
  #   offlabel vs ctrl_pool   -0.46               -1.58
  #   ctrl_pool vs base_more  +0.53               +0.98 *
  #
  # Twelve of fifteen arms lose on the unexplained half (binomial p=0.018).
  # The head CAPACITY helps that half; it is the VAD CONTENT that costs. So
  # whitevad's whole benefit sits in the half VAD already had, and its net
  # effect against no head at all on the unexplained half is -0.08.
  #
  # These arms weight the auxiliary MSE by the Gaussian posterior of the row's
  # own label, so the VAD target is applied where VAD and the label agree and
  # falls silent where they conflict. per_class mode rescales the weights to
  # mean one WITHIN each class: the raw posterior averages 0.41 on neutral
  # against 0.78 on angry, so the global mode would silently reweight classes
  # and be confounded with clsbal, which is already known not to help.
  #
  # Prediction, recorded before running: the explained half holds near +0.85
  # and the unexplained half moves from -1.06 toward 0. If BOTH collapse, the
  # head needed gradient from all rows and this whole reading is wrong.
  #
  # These are new arms with no cached runs, so adding MSPI to test_datasets is
  # safe here. It must NOT be added to the shared template: is_run_finished
  # does a subset check on test_datasets, so every completed arm would be
  # retrained.
  - <<: *template
    name: "uf4_vadtrust"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7, 1234, 2024]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_vad_trust: "per_class"
    class_weight_mode: "sqrt_inverse_freq"

  # Matched control. Permutes the trust weights across the batch, so their
  # distribution is preserved exactly and only the pairing with the sample is
  # destroyed. Any gain that survives this is not the mechanism.
  - <<: *template
    name: "uf4_vadtrust_ctrl"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7, 1234, 2024]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_vad_trust: "per_class"
    proto_vad_trust_shuffle: true
    class_weight_mode: "sqrt_inverse_freq"

  # Seed top-up for uf4_agree_lam, which is the ONLY informative arm positive
  # on the VAD-unexplained half (+0.98 at 3 seeds, ns). It is also the only
  # target in the sweep that is not VAD, which is the reason to take it
  # seriously rather than treat it as noise.
  #
  # A separate arm rather than an extended seeds list: seeds IS part of the
  # config fingerprint (verified 2026-09-15), so editing uf4_agree_lam's list
  # would mark its three finished runs stale and retrain them. Same reason
  # uf4_res_more and uf4_base_more exist.
  - <<: *template
    name: "uf4_agree_lam_more"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [1234, 2024]
    use_proto_predictor: true
    proto_target: "agreement"
    proto_predictor_weight: 22.3
    class_weight_mode: "sqrt_inverse_freq"

  # ---- Gradient surgery at 4/4, where the harm is actually measured ----
  #
  # The auxiliary head hurts on rows a VAD-only classifier gets wrong: whitevad
  # is +0.85 explained / -1.06 unexplained against uf4_ctrl_pool, both p<0.05
  # over five seeds. The proposed mechanism is gradient conflict. On an
  # unexplained row VAD points at a rival class while the label does not, so
  # the auxiliary and classification gradients oppose each other through the
  # shared trunk, and the encoder is asked to represent evidence against the
  # correct answer.
  #
  # PCGrad projects the auxiliary gradient onto the orthogonal complement of
  # the main gradient wherever they conflict. Orthogonal components pass
  # through untouched, so the usual justification for an auxiliary task
  # (retaining information CE would discard) is preserved.
  #
  # Two outcomes, and they are distinguishable:
  #   explained holds near +0.85, unexplained -> 0   conflict was the harm
  #   BOTH collapse                                  the conflict WAS the
  #                                                  benefit, and the head only
  #                                                  ever worked by opposing CE
  #
  # Uses proto_pcgrad_per_sample, NOT the older batch-level proto_pcgrad. The
  # batch-level version takes gradients of the batch-MEAN losses, so its
  # conflict test runs on the aggregate per parameter tensor. At batch 16 with
  # a 65/35 explained to unexplained mix the auxiliary gradient is dominated by
  # explained rows before any projection happens, so it cannot protect the
  # minority where the conflict lives.
  #
  # The per-sample version projects row by row at the shared representation,
  # against the CLASSIFICATION gradient captured in one extra partial backward
  # through the classifier head only. Verified 2026-09-15: conflicting rows are
  # orthogonalised to within 1e-4, agreeing rows are bitwise unchanged, no row
  # gradient norm grows, the projection is invariant to scaling of the
  # reference (so AMP loss scaling cannot perturb it), and the disabled path is
  # an exact identity.
  #
  # Read against uf4_whitevad and uf4_ctrl_pool, both 5 seeds at this exact
  # configuration. No new control is needed.
  #
  # pcgrad_res is the only prior run: 2/2, seed 42 only, at a draw where the
  # harm did not appear (-0.06), so it settled nothing. The 4-seed 2/2 arm
  # cw_sqrt_res_more does show it at -0.77.
  #
  # New arm, no cached runs, so MSPI in test_datasets is safe here. It must NOT
  # go in the shared template: is_run_finished subset-checks test_datasets and
  # every completed arm would retrain.
  - <<: *template
    name: "uf4_whitevad_pcgrad_ps"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7, 1234, 2024]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_pcgrad_per_sample: true
    class_weight_mode: "sqrt_inverse_freq"

  # ---- Explainability head, ADDITIONAL to the VAD regression head ----
  #
  # A second auxiliary output predicting whether this row's label is accounted
  # for by its VAD at all, i.e. whether a RIVAL class centre sits closer than
  # its own. Runs alongside the whitevad regression target rather than
  # replacing it, so the comparison against uf4_whitevad isolates what the
  # second task adds.
  #
  # Why this quantity and not the residual norm. On IEMOCAP the toward-rival
  # component of the residual predicts the explained/unexplained split at AUC
  # 0.931, the residual NORM reaches only 0.654, and the orthogonal component
  # is exactly chance at 0.500. Half of the most displaced quintile by norm is
  # still explained, because those rows drifted where no rival lives. mahal and
  # protoscore are both functions of the norm and so aim at the weaker of the
  # two. This targets the competitive condition directly.
  #
  # Why it survives the critique that sank the class-relative residual: it is
  # non-affine in VAD and depends on ALL FOUR class centres, so a globally
  # standardised VAD target cannot reproduce it. whitevad matched res at
  # p=0.918 precisely because the class-relative construction was an affine
  # recoding; a max over classes is not.
  #
  # The existing head does not already carry this. Inverting uf4_whitevad's
  # own aux_pred back to a predicted VAD recovers explainability at AUC 0.671
  # over five seeds, against 1.000 from true VAD, and its thresholded agreement
  # of 62.9 percent is BELOW the 65.2 percent majority baseline because the
  # predicted residual is shrunk by about half.
  #
  # Binary under BCE, so there is no target variance to match and the
  # proto_predictor_weight confound that distorted the earlier comparison table
  # does not arise. expl_head_weight is relative to the regression term; both
  # losses are order 1 at init (MSE about 1.0 on a unit-variance target, BCE
  # about 0.69 at the 0.666 base rate), so 1.0 needs no calibration.
  #
  # Implementation note: with proto_predictor_hidden_dim 0 the head is a bare
  # nn.Linear whose output rows share no parameters, so one Linear(1024, 4) is
  # mathematically identical to two independent heads. train.py refuses
  # use_expl_head with a hidden layer, where they would genuinely share weights.
  #
  # New arms, no cached runs, so MSPI in test_datasets is safe. It must NOT go
  # in the shared template: is_run_finished subset-checks test_datasets and
  # every completed arm would retrain.
  - <<: *template
    name: "uf4_whitevad_expl"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7, 1234, 2024]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    use_proto_predictor: true
    proto_target: "whitevad"
    use_expl_head: true
    expl_head_weight: 1.0
    class_weight_mode: "sqrt_inverse_freq"

  # Matched control. Permutes the explainability targets across the batch, so
  # their class balance is preserved exactly and only the pairing with the
  # sample is destroyed. The regression half is untouched, so this isolates the
  # explainability task specifically rather than the extra output row.
  - <<: *template
    name: "uf4_whitevad_expl_ctrl"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7, 1234, 2024]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    use_proto_predictor: true
    proto_target: "whitevad"
    use_expl_head: true
    expl_head_weight: 1.0
    expl_head_shuffle: true
    class_weight_mode: "sqrt_inverse_freq"

  # ---- Mixup whose label follows the blend, not the parent ----
  #
  # Existing muted mixup keeps the parent's hard emotional label on a point
  # blended toward neutral. Measured at 3 seeds on IEMOCAP that is what costs
  # neutral: recall falls 54.3 -> 36.6 -> 27.4 as blending increases, with the
  # mass moving into happy (17.9 -> 27.3 -> 31.6) and sad (20.3 -> 27.6 ->
  # 31.3). Both mixup variants lose to a no-mixup baseline (-1.12 p=0.008 and
  # -1.95 p=0.007), and under oracle per-class recalibration all three
  # converge to 62.3-62.5, so the apparent happy and sad gains were the
  # operating point sliding rather than better discrimination.
  #
  # Here the blend's VAD is interpolated at the same lambda and the fitted
  # class model assigns the label. The correspondence is exact rather than
  # assumed: the auxiliary head is a bare nn.Linear, and a linear map of a
  # convex combination is the convex combination of the maps. A blend landing
  # in neutral's region becomes neutral, so no synthetic point is mislabelled
  # by construction.
  #
  # Measured on 20,000 real blends, the derived label differs from the
  # inherited one 38.6 percent of the time and 74.7 percent of those become
  # neutral, so the intervention is large and aimed where the damage was.
  #
  # Verified 2026-09-16: lambda 1 returns the source class, lambda 0 returns
  # the partner's, and an angry-to-neutral sweep flips at lambda 0.45.
  #
  # The risk is that neutral and sad are the closest pair in VAD (0.165, ratio
  # 0.52 to the mean pair distance under every affine transform tried), so
  # blends near that boundary get noisy labels. The gated arm discards them.
  - <<: *template
    name: "uf4_vadmix_derive"
    # The fitted class VAD statistics live behind use_proto_predictor,
    # and derive_labels needs them to place a blend. The head is built
    # but given zero weight, so it contributes no gradient. Identical
    # across all three arms, so it cancels in the comparison.
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    test_datasets: ["IEMO", "SAMSEMO", "MSPI"]
    class_weight_mode: "sqrt_inverse_freq"
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_vad_calibrated: true
    muted_mixup_vad_quantile: 0.5
    muted_mixup_derive_labels: true
    muted_mixup_derive_min_posterior: 0.0

  # Same blends, same count, gate on the blend's class posterior so points
  # falling in the neutral/sad ambiguity are discarded rather than guessed.
  - <<: *template
    name: "uf4_vadmix_derive_gate"
    # The fitted class VAD statistics live behind use_proto_predictor,
    # and derive_labels needs them to place a blend. The head is built
    # but given zero weight, so it contributes no gradient. Identical
    # across all three arms, so it cancels in the comparison.
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_vad_calibrated: true
    muted_mixup_vad_quantile: 0.5
    muted_mixup_derive_labels: true
    muted_mixup_derive_min_posterior: 0.5

  # THE CONTROL THAT MATTERS. Identical synthetic data, identical blend
  # coefficients, identical count and gradient path. The only difference is
  # that the label is inherited from the dominant parent, which is the
  # existing behaviour. This isolates the labelling rule and nothing else.
  - <<: *template
    name: "uf4_vadmix_inherit"
    # The fitted class VAD statistics live behind use_proto_predictor,
    # and derive_labels needs them to place a blend. The head is built
    # but given zero weight, so it contributes no gradient. Identical
    # across all three arms, so it cancels in the comparison.
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    test_datasets: ["IEMO", "SAMSEMO", "MSPI"]
    class_weight_mode: "sqrt_inverse_freq"
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_vad_calibrated: true
    muted_mixup_vad_quantile: 0.5
    muted_mixup_derive_labels: false

  # ---- General mixup with a soft, geometry-derived target ----
  #
  # Three changes from the directed variants, each answering a measurement.
  #
  # ANY PAIR. muted_mixup blends only emotional samples toward neutral, so
  # neutral is a partner and never a source and gets no synthetic data.
  # symmetric_mixup_step adds the reverse direction but still only crosses the
  # neutral boundary.
  #
  # CONTROLLED LAMBDA. The VAD-calibrated coefficient has median 0.47 with a
  # tenth of blends below 0.09, i.e. 91 percent partner. sample_lambda already
  # folds Beta(alpha, alpha) into [0.5, 1] for exactly this reason; the
  # VAD-calibrated path had reintroduced the extremes it was written to avoid.
  #
  # SOFT TARGET. Inheriting the parent's label drove neutral recall from 54.3
  # to 27.4 percent. Taking the argmax of the blended VAD fixes the direction
  # but still asserts confidence: over 30,000 blends the top posterior is
  # below 0.5 on 27.7 percent, and at the class flip points it is 0.33 (angry),
  # 0.42 (sad), 0.46 (happy). Here the posterior IS the target, so no switch
  # point or threshold is chosen anywhere.
  #
  # Verified 2026-09-17: lambda in [0.50, 0.99] median 0.68; targets sum to 1;
  # the soft argmax differs from the dominant source's label on 37.9 percent
  # of blends; soft and hard paths produce identical coefficients and
  # identical blends given the same draw, so only the target differs.
  - <<: *template
    name: "uf4_softmix"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true

  # Matched control: identical pairs, identical coefficients, identical
  # blends. The only difference is that the target is the dominant source's
  # hard label rather than the blend's posterior. That isolates the soft
  # geometry-derived target and nothing else.
  - <<: *template
    name: "uf4_softmix_ctrl"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
