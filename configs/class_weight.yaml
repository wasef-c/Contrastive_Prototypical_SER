  # ==== Within-corpus IEMOCAP replication (session-independent CV) ====
  #
  # Every arm above trains on MSP-Podcast and evaluates zero-shot, which is
  # the harder protocol but makes our numbers incomparable to the published
  # SER literature. Wang et al. (EAM, arXiv 2512.04551) report 79.14 percent
  # UA on exactly the subset we call IEMOFULL: 'exc' merged into 'hap' giving
  # 5,531 utterances over four classes (happy 1,636, angry 1,103, sad 1,084,
  # neutral 1,708), scored by 5-fold session-independent cross-validation.
  # Our IEMOFULL loader reproduces those counts exactly, so the only thing
  # standing between us and a comparable number is the protocol.
  #
  # heldout_session: N trains on the other four sessions and evaluates on
  # session N. Each session holds exactly two speakers, so the fold is
  # speaker-disjoint and condition-disjoint by construction. The held-out
  # session is the validation split AND the reported evaluation set, which is
  # only sound because model_selection is swa_last_n: the reported model
  # averages the final epochs, so no epoch is chosen using the scored rows.
  # Do not set use_early_stopping or a best-epoch selection on these arms.
  #
  # test_datasets names the training corpus on purpose, which resolves to NO
  # cross-corpus evaluation at all: create_datasets drops any training corpus
  # from the test list, leaving it empty. Do NOT write an empty list here
  # instead, because create_datasets reads an empty test list as "evaluate on
  # every registered corpus" and would load the whole dataset map, MSPI
  # included. Naming IEMOFULL also keeps the cache key stable, since the
  # finished-run check compares the requested list as written.
  #
  # The evaluation set under this protocol is the held-out session, which
  # arrives through the validation path rather than the test path.
  #
  # Pilot only. The training pool is 4,425 rows against MSP-Podcast's 60,708,
  # so the 8-epoch budget above is roughly a fourteenth of the optimisation.
  # This arm runs one fold of the no-mixup baseline over a long budget to see
  # where the held-out curve settles, so a single epoch count can be fixed
  # for every comparison arm before any of them runs. It is a feasibility
  # check, not a tuning step: the budget is chosen once, shared by all arms,
  # and no arm's reported number is selected from its own curve.
  - <<: *template
    name: "cv_pilot"
    train_dataset: ["IEMOFULL"]
    test_datasets: ["IEMOFULL"]
    heldout_session: 1
    num_epochs: 32
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42]
    use_proto_predictor: false
    class_weight_mode: "sqrt_inverse_freq"

  # ==== Within-corpus IEMOCAP comparison arms (5-fold session CV) ====
