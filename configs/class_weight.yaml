    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true
    muted_mixup_hard_control: true

  # ---- Soft target in the AGGRESSIVE blending regime ----
  #
  # The four cells of this design, measured at 3 seeds each:
  #
  #   lambda       label      neutral   net effect
  #   aggressive   inherited    48.3%   damage (-0.64 recal vs ctrl_pool)
  #   mild         hard         67.7%   inert  (-0.57 recal)
  #   mild         SOFT         64.9%   +0.63 recal over its own control, p=0.042
  #   aggressive   SOFT             ?   this arm
  #
  # Aggressive blending is the regime where the augmentation does something;
  # it was abandoned because a hard label there is mislabelling by
  # construction. A soft target removes that objection: the target follows the
  # blend rather than its source, so a partner-dominated blend is described
  # honestly instead of being asserted to be its source's class.
  #
  # If the soft target's value is repairing mislabelled blends, the effect
  # should be LARGEST here, where the mislabelling was worst. If it is flat,
  # the mild-regime result was something else.
  #
  # alpha 1.0 unfolded gives p10 0.10, median 0.50, matching the VAD-calibrated
  # coefficient that caused the damage (p10 0.09, median 0.47). Verified
  # 2026-09-18, along with soft and hard paths drawing identical coefficients
  # and identical blends, disagreeing on 37.7 percent of labels.
  - <<: *template
    name: "uf4_softmix_agg"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    test_datasets: ["IEMO", "SAMSEMO", "MSPI"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 1.0
    muted_mixup_general_soft: true
    muted_mixup_fold_lambda: false

  # Matched control. Identical pairs, coefficients and blends; the target is
  # the hard label of whichever endpoint dominates. Unfolded lambda means the
  # dominant endpoint is chosen per sample rather than always being the source.
  - <<: *template
    name: "uf4_softmix_agg_ctrl"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    test_datasets: ["IEMO", "SAMSEMO", "MSPI"]
