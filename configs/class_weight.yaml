  # ==== The VAD-FREE control ====
  #
  # The shuffled ablation showed that a target need not describe its own
  # blend: at n=5 ours minus shuffled is +0.002 accuracy and +0.009 macro F1
  # averaged over the three corpora. But that control still DRAWS its targets
  # from q, so it still requires the VAD annotations. This asks the harder
  # question: does the target need to come from VAD at all?
  #
  # Targets are sampled from a Dirichlet fitted, per source class, to match
  # q's class-conditional mean and entropy. Verified against q on 20,000 real
  # blends: entropy 0.8489 against 0.8466, mean max 0.6242 against 0.6221,
  # marginal L1 0.0007, class-conditional means agreeing to three decimals,
  # and the same correlation with the true target as the shuffled control
  # (0.437 against 0.433), which is the correlation class structure alone
  # induces. No affect information about any blend survives.
  #
  #   Dirichlet ~ shuffled ~ ours  -> VAD is unnecessary here; the finding is
  #       that class-conditional high-entropy targets improve mixup, and the
  #       affect machinery earns nothing.
  #   shuffled > Dirichlet         -> q's target FAMILY matters even though
  #       the per-blend correspondence does not.
  #
  # It cannot rescue the per-blend claim, which is already settled.

  - <<: *template
