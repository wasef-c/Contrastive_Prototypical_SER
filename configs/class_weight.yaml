  # ==================================================================
  # Queue 118. Two things the GenLabel row cannot settle on its own.
  # ==================================================================
  #
  # A. SPACE-MATCHED CONTROL (uf4_genlabel_pca3).
  #
  # The question our placebo and shuffle arms do NOT answer: is the gain
  # because VAD is the right space, or because fitting class-conditional
  # Gaussians and relabelling by their posterior helps at all? Those arms
  # remove or scramble affect content; neither substitutes a LEARNED geometry
  # of the same size.
  #
  # This arm matches our method on every component except the space:
  #   same pairs, same folded Beta(2,2) lambda, same blends
  #     (genlabel_mixup_step duplicates general_soft_mixup_step's pairing)
  #   same density family: empirical per-class mean and covariance
  #   same ridge: tol 1e-4 equals the cov + 1e-4 * I in class_vad_stats
  #   same shrinkage: none
  #   same dimensionality: 3
  #   same rule: normalised posterior, uniform priors
  #   same loss weight: muted_mixup_weight 0.5
  # The ONLY difference is that the Gaussians are fitted on a PCA-3 projection
  # of the learned fusion embedding instead of on annotated VAD.
  #
  # ONE CONFOUND WE CANNOT REMOVE, and must state in the paper rather than
  # claim away: our VAD Gaussians are fitted ONCE before training and are
  # static, because annotations do not move. Embeddings do move, so the
  # PCA-3 densities are refitted at every epoch boundary and epoch 1 trains
  # on the vanilla target during warmup. That difference is forced by the
  # space and is not a free choice, but it is a difference.
  #
  # shrinkage 0.0 and not the 0.1 of uf4_genlabel: in 3 dimensions with
  # roughly 15k training rows per class the covariance is well conditioned,
  # so shrinkage would be an unmatched extra regulariser.
  #
  # WHY proj_mode lda AND NOT THE PCA-64 ARM'S BASIS. uf4_genlabel keeps the
  # top eigenvectors of the pooled WITHIN-class covariance, which are the
  # directions of greatest spread inside each class rather than the
  # directions that separate the classes. Measured on synthetic data whose
  # class signal occupies 3 directions under larger nuisance variance, that
  # basis at 3 dimensions gives a mean top posterior of 0.259 against the
  # uniform 0.25, an entropy of 1.3856 against the maximum 1.3863, and an
  # argmax that matches the source class on 26.1 percent of blends, which is
  # chance. It carries no class information at all, so an arm built on it
  # would lose for want of capacity and would say nothing about the space.
  # LDA on the same data gives 0.7259, entropy 0.6848 and 71.8 percent, and
  # its 0.6848 is close to this method's own 0.850, so the two targets are
  # comparable in softness. LDA also returns exactly num_classes - 1 = 3
  # directions for four classes, so the dimensionality is forced by the
  # class count rather than chosen to match VAD.
  - <<: *template
    name: "uf4_genlabel_lda3"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: "5e-6"
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: false
    use_genlabel: true
    genlabel_gamma: 1.0
    genlabel_pca_dim: 3
    genlabel_proj_mode: "lda"
    genlabel_shrinkage: 0.0
    genlabel_tol: 0.0001

  # Seeds 4 and 5 of the space-matched control. Separate arm because
  # config.seeds is part of the training fingerprint (runner.py:196), so
  # appending seeds to the arm above would mark its finished runs stale and
