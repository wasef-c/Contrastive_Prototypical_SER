  # ---- Ablation: does evaluating the MIXED affect location matter? ----
  #
  # uf4_softmix supervises with q(lam * v_a + (1 - lam) * v_b), the posterior
  # AT the blended VAD point. This arm supervises with lam * q(v_a) +
  # (1 - lam) * q(v_b), the two endpoints' own posteriors interpolated by the
  # same lambda. Same fitted q, same blends, same lambda, same soft-target
  # loss. Both targets are soft and both are VAD-derived, so a difference
  # between them cannot be soft-versus-hard and cannot be "uses VAD": it can
  # only be the nonlinearity of q along the segment joining the endpoints.
  #
  # Measured over 40,000 real MSP-Podcast blends, this is a TIGHT control.
  # Against the blended-point target the endpoint target sits at median
  # total-variation 0.084 with 82.5 percent argmax agreement, while vanilla
  # mixup sits at 0.396 and 61.4 percent. So the endpoint arm keeps most of
  # what separates our target from vanilla. Expect a small effect, and treat
  # a null as underpowered rather than as evidence of no difference.
  #
  # Curiously the endpoint target is the SPREADER of the two: it puts
  # meaningful mass on a third class in 5.1 percent of blends against 1.7 for
  # the blended point, because averaging two posteriors cannot sharpen.
  - <<: *template
    name: "uf4_softmix_endpt"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true
    muted_mixup_endpoint_posterior: true

  # ---- GenLabel baseline (Sohn et al., ICML 2022, arXiv 2201.02354) ----
  #
  # The published alternative to our mechanism: relabel the mixed point by
  # class-conditional generative densities, but fitted on the DATA rather
  # than on an annotated affect space. Target is the normalised class
  # likelihood at z_mix, with gamma weighting it against the vanilla mixup
  # target; gamma = 1.0 is the pure GenLabel target, matching our arm's pure
  # geometry target. This is the arm that decides whether the contribution is
  # "relabel mixed points by a generative model" (already published) or
  # "relabel them by an annotated affect geometry" (ours).
  #
  # use_proto_predictor stays on at weight 0.0 so the auxiliary head is
  # constructed and the RNG stream matches the arms it is compared against.
  # It contributes no gradient here, exactly as in uf4_softmix.
  #
  # Adaptations from the paper are documented in utils/genlabel.py. The one
  # that changes behaviour most: in the raw 1024-d embedding the Gaussian log
  # densities differ by thousands of nats, so the normalised label is one-hot
  # in 100 percent of rows and GenLabel silently degenerates into HARD
  # relabeling. A PCA to 64 dimensions, fitted from the same pooled
  # accumulator, restores a usable posterior (mean max 0.70).
  #
  # NOTHING HERE IS TUNED. pca_dim and shrinkage are fixed a priori on the
  # stated grounds above, not selected by any search on any split. The
  # paper-faithful unreduced form runs as uf4_genlabel_raw, so the choice is
  # reported as a pair rather than hidden inside a selection step.
  - <<: *template
    name: "uf4_genlabel"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: false
    use_genlabel: true
    genlabel_gamma: 1.0
    genlabel_pca_dim: 64
    genlabel_shrinkage: 0.1
    genlabel_tol: 0.0001

  # ---- GenLabel exactly as published, no dimensionality adaptation ----
  #
  # Same arm with the authors' own settings: full 1024-d embedding, their
  # cov + 1e-4 * I floor, no shrinkage, no projection. Expected to produce a
  # near one-hot target and so to behave like a hard relabeling scheme. It
  # runs so that the PCA choice in uf4_genlabel is visible as a choice rather
  # than buried, and so that neither a favourable nor an unfavourable
  # adaptation can be assumed.
  - <<: *template
    name: "uf4_genlabel_raw"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    test_datasets: ["IEMO", "SAMSEMO", "MSPI"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: false
    use_genlabel: true
    genlabel_gamma: 1.0
    genlabel_pca_dim: 0
    genlabel_shrinkage: 0.0
    genlabel_tol: 0.0001

  # ---- VAD-derived soft labels WITHOUT mixup ----
  #
  # The control that decides whether mixup is part of the mechanism at all.
  # Each real sample is supervised with q(v), the class posterior at its own
  # annotated VAD point. No blending, no partner, no lambda.
  #
  # Why this is the decisive decomposition: the endpoint-posterior target
  # lam * q(v_a) + (1 - lam) * q(v_b) is EXACTLY this relabeling followed by
  # standard unmodified mixup, because mixup's label rule is linear and the
  # two operations commute. Our own target q(lam * v_a + (1 - lam) * v_b)
  # does not decompose that way, since q is nonlinear. So:
  #   this arm wins            -> the contribution is VAD soft labels and
  #                               mixup is decoration
  #   endpoint wins, not this  -> soft labels need the blending to help
  #   ours wins over both      -> evaluating the mixed affect location is
  #                               doing something neither can express
  #
  # The target is far from the hard label: measured on 20,233 development
  # rows it agrees with the annotated category on only 66.0 percent of rows
  # and places a mean of 0.565 mass on it, so this is partial relabeling of
  # the training set, not label smoothing.
  - <<: *template
    name: "uf4_vadsoft"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    test_datasets: ["IEMO", "SAMSEMO", "IEMOFULL"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: false
    use_vad_soft_labels: true
    vad_soft_label_shuffle: false

  # Placebo for the arm above. The soft labels are permuted WITHIN each
  # class, so every sample still receives a soft label typical of its own
  # class. Verified on the development split: identical mean entropy
  # (0.7182), identical marginal, identical mean mass on the sample's own
  # hard label (0.565), while 48.7 percent of rows receive a different
  # argmax. Everything about the softness is preserved and only the
  # per-sample correspondence to that sample's own affect annotation is
  # destroyed, so a gain that survives here is not about VAD.
  - <<: *template
    name: "uf4_vadsoft_ctrl"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: false
    use_vad_soft_labels: true
    vad_soft_label_shuffle: true

  # ---- Control: is the mechanism just implicit class rebalancing? ----
  #
  # q uses UNIFORM class priors, which is not a neutral choice. Neutral is
  # 45.3 percent of the fitting rows, so dropping the prior discounts it
  # systematically: a neutral sample's target averages 0.407 on neutral
  # against 0.601 once empirical priors are restored, and sad, at 10.7
  # percent of the data, is inflated from 0.359 to 0.587. That is the same
  # direction as the entire measured effect, every confusion-matrix row
  # losing neutral mass, so "geometry" and "class rebalancing" currently
  # predict the same thing.
  #
  # This arm restores the empirical priors and changes nothing else. If the
  # gain survives it is geometry. If it vanishes we have been rediscovering
  # class reweighting with extra steps, and this is the arm that says so.
  - <<: *template
    name: "uf4_softmix_prior"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true
    muted_mixup_class_priors: true

  # ---- Refinement: do not discard a certainty ----
  #
  # 32.7 percent of blends pair two samples of the SAME class, where the
  # label is not in doubt: a blend of two sad utterances is sad. Vanilla
  # mixup gets these exactly right at one-hot; our target places only 0.549
  # mass on the correct label there, so a third of the training signal is
  # spent unlearning something already known. This gates on parent
  # agreement: one-hot when the parents share a class, q at the blended
  # point otherwise. Mass on the true label rises from 0.504 to 0.647
  # overall.
  #
  # The gate is a property of the pair, not a tuned threshold, so nothing
  # is selected on any split. It should also help the endpoint arm, so it
  # does not by itself settle whether the mixed-point evaluation matters.
  - <<: *template
    name: "uf4_softmix_gate"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true
    muted_mixup_same_class_hard: true

  # ---- Consensus-weighted trust in the annotated label ----
  #
  # q contradicts the categorical annotation on 33.6 percent of training
  # rows. Measured on all 80,941 rows with annotator metadata, that
  # disagreement tracks LABEL reliability and not VAD reliability:
  # categorical consensus is 0.634 on disagreeing rows against 0.696 on
  # agreeing ones, while annotator VAD dispersion is identical (0.787
  # against 0.786). So there is no detectable "the VAD is wrong"
  # population, only "the label is unreliable" and "genuinely atypical".
  #
  # The disagreement is also overwhelmingly a NEUTRAL problem: 48.4 percent
  # of neutral rows disagree against 13.2 percent of angry, and neutral
  # rows are about 65 percent of all disagreements. Neutral in VAD space is
  # not a cluster, it is the absence of displacement, so a Gaussian fitted
  # to it overlaps sad and happy heavily. That is the likely origin of the
  # neutral recall loss this arm is meant to mitigate.
  #
  # Mechanism: let per-sample consensus decide how far the geometry may
  # override the parents' labels.
  #   c = lam*c_a + (1-lam)*c_b,  w = (1-c)/(1-c_min),
  #   target = w*q(v_mix) + (1-w)*vanilla
  # A blend of two unanimously annotated utterances keeps the vanilla
  # target; one whose parents annotators argued about is labelled by where
  # it lands. c_min is the smallest consensus on the fitting rows, so no
  # tuned constant enters. 19.9 percent of rows have perfect consensus and
  # fall back to vanilla entirely.
  #
  # Side effect worth noting: it also pulls the target marginal back toward
  # the true class distribution, neutral 0.341 -> 0.415 against a true
  # 0.453, and sad 0.199 -> 0.139 against 0.107.
  #
  # CAUTION: this damps average geometry strength to w mean 0.41, so it
  # must be judged against the shuffled placebo below, which carries an
  # IDENTICAL w distribution (verified: mean 0.4065, same quartiles), not
  # against uf4_softmix.
  - <<: *template
    name: "uf4_softmix_trust"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true
    muted_mixup_trust_target: true
    muted_mixup_trust_shuffle: false

  # Placebo. Consensus is permuted WITHIN each class, so every sample still
  # receives a trust weight typical of its class and the distribution of w
  # is bit-identical; only the correspondence between a sample and its own
  # annotators' agreement is destroyed. A gain that survives here is not
  # about consensus.
  - <<: *template
    name: "uf4_softmix_trust_ctrl"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true
    muted_mixup_trust_target: true
    muted_mixup_trust_shuffle: true

  # ---- Calibrated prior: stop over-suppressing neutral ----
  #
  # Uniform priors are the standard generative-classifier choice, but they
  # are not calibrated to what training actually sees. Over 120,000 blends
  # the target marginal injects neutral at 0.340 against a true 0.453 and
  # sad at 0.195 against 0.107, an 83 percent over-weight. That aggregate
  # skew is the neutral-recall loss at its origin, and on SAMSEMO it
  # overshoots: the model there already UNDER-predicts neutral (41.3
  # against a true 43.9), so pushing further moves the predicted
  # distribution away from truth and accuracy goes flat.
  #
  # Empirical class priors are the obvious fix and are too blunt: they
  # overshoot to neutral 0.510, disagree with the uniform-prior target's
  # argmax on a quarter of blends, and removed the gain entirely.
  #
  # This solves instead for the log-prior offset under which the BLEND
  # marginal matches the class distribution, by iterative proportional
  # fitting at setup. Nothing is tuned. Measured: marginal L1 to truth
  # 0.0000 (0.227 for uniform, 0.115 for empirical), while preserving 81
  # percent of the per-sample argmax against 74 percent for empirical. It
  # is seed-stable to +/-0.01 and generalises to held-out blend draws
  # (L1 0.0026). Solved offset on MSP-Podcast is roughly
  # [+0.32, +0.03, -0.77, -0.18], i.e. boost neutral, suppress sad.
  #
  # Known cost: third-class mass, the property only the mixed-point target
  # can express, drops from 7.1 to 2.8 percent of blends. Calibration and
  # that behaviour trade against each other.
  - <<: *template
    name: "uf4_softmix_cal"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true
    muted_mixup_calibrated_prior: true

  # ---- Fit the class Gaussians on high-agreement rows only ----
  #
  # Diagnosis this targets: neutral's posterior is capped at 0.541 even AT
  # its own centroid, while angry reaches 0.958, happy 0.803 and sad 0.670.
  # So the mixup branch cannot give neutral confident supervision at all:
  # only 3.4 percent of blends carry a neutral target above 0.6, and of the
  # blends whose argmax IS neutral, 0.3 percent exceed 0.7 confidence
  # against 54 percent for happy and 57 percent for angry. Neutral recall
  # falls because neutral never receives a sharp signal, not because mass
  # is deliberately pushed away.
  #
  # The cause is the fitted covariance. 48.4 percent of neutral rows have
  # VAD that contradicts their categorical label, against 13.2 percent of
  # angry; those rows contribute VAD that summarises annotator disagreement
  # rather than measuring the emotion, and they inflate neutral's scatter.
  #
  # Fitting on the top-quartile-agreement rows instead, measured:
  #   neutral ceiling   0.541 -> 0.696      neutral-sad separation 0.165 -> 0.225
  #   sad ceiling       0.670 -> 0.812      sad-angry separation   0.395 -> 0.499
  #   blend marginal, neutral 0.339 -> 0.426 against a true 0.453
  #   confident neutral blends (>0.6)  3.4% -> 34.7%
  # The marginal moves toward truth as a SIDE EFFECT of sharper geometry,
  # not by distorting the label, which is what separates this from
  # uf4_softmix_prior and uf4_softmix_cal. Both of those corrected the
  # marginal directly and removed the effect.
  #
  # PRIOR EVIDENCE IS AGAINST THIS. Consensus fitting has been tried four
  # times (uf4_cons, cc_class, cc_vad, cc_lr5e6) and was flat to -0.5. But
  # every one of those was an AUXILIARY-TASK arm: proto_predictor_weight
  # 1.0, proto_target residual, mixup off. The aux head regresses a scalar
  # from the centroids and never forms a posterior, so the 0.541 ceiling
  # has no analogue there. No arm has ever combined mixup with
  # consensus_q > 0.
  #
  # Known risk: the Gaussians are fitted on the high-agreement quartile but
  # used to label blends drawn from ALL training rows, a fit/apply
  # population mismatch. That may be why it underperformed in the aux
  # context. Counter-evidence is that the blend marginal moves toward the
  # true prior under filtering, not away.
  #
  # Falsifiable prediction: neutral recall should RISE against uf4_softmix.
  # If it does not, the "neutral is under-supervised" diagnosis is wrong.
  - <<: *template
    name: "uf4_softmix_cons"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    proto_centroid_consensus_q: 0.75
    proto_consensus_source: "class"
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true

  # ==== VAD-consistent mixup on the AUXILIARY target ====
  #
  # For a CONTINUOUS target, mixup is exactly correct rather than assumed:
  # the blend of two utterances genuinely has the blended affect
  # coordinates, and the whitevad target is an affine map of VAD, so the
  # blended target equals the blend of the endpoint targets identically.
  # None of the problems that afflict the categorical target apply -- no
  # posterior, no 0.541 neutral ceiling, no marginal skew, no
  # neutral/emotional trade.
  #
  # The constraint only exists with a NONLINEAR head. Verified numerically:
  # with hidden_dim 0 the head is a bare linear map and
  # |f(lam*z_a + (1-lam)*z_b) - (lam*f(z_a) + (1-lam)*f(z_b))| = 0.000000
  # exactly, so the blend term collapses to a weaker copy of the endpoint
  # loss. With hidden 256 the gap is 0.0415 and the term becomes a real
  # structural prior: affect varies linearly along segments between
  # training points in embedding space.
  #
  # Three arms, because the nonlinear head is itself a change from
  # uf4_whitevad (hidden_dim 0). uf4_auxnl isolates the head; _mix adds the
  # constraint; _mix_ctrl is the placebo. The decisive contrast is
  # _mix minus _auxnl, with _mix_ctrl showing it is not just extra
  # regression noise on synthetic points.

  # Baseline for the new head: nonlinear aux VAD, no blend term.
  - <<: *template
    name: "uf4_auxnl"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 1.0
    proto_predictor_hidden_dim: 256
    use_muted_mixup: false
    aux_vad_mixup: false

  # The idea: the auxiliary head must map a blended embedding to the
  # blended affect coordinates.
  - <<: *template
    name: "uf4_auxnl_mix"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 1.0
    proto_predictor_hidden_dim: 256
    use_muted_mixup: false
    aux_vad_mixup: true
    aux_vad_mixup_weight: 1.0
    aux_vad_mixup_alpha: 2.0
    aux_vad_mixup_fold: true
    aux_vad_mixup_shuffle: false

  # Placebo. Identical blended embeddings and an identical DISTRIBUTION of
  # blended targets, but the pairing between a blend and its target is
  # permuted across the batch. Same loss scale, same synthetic points, same
  # gradient path; the only thing removed is whether the target is the
  # blend's OWN affect coordinate. A gain that survives here is not about
  # affect consistency.
  - <<: *template
    name: "uf4_auxnl_mix_ctrl"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 1.0
    proto_predictor_hidden_dim: 256
    use_muted_mixup: false
    aux_vad_mixup: true
    aux_vad_mixup_weight: 1.0
    aux_vad_mixup_alpha: 2.0
    aux_vad_mixup_fold: true
    aux_vad_mixup_shuffle: true

  # ==== Auxiliary head learning rate ====
  #
  # The aux head is randomly initialised but trained at the trunk's
  # fine-tuning rate, 5e-6. Evidence that this is wrong: a 1024-256-3 head
  # reaches train MSE 0.543 while a 1024-3 head reaches 0.527 on the SAME
  # target. More capacity fitting worse is an optimisation failure, not a
  # capacity one, and it makes the nonlinear arms uninterpretable -- a
  # linearity constraint on a map that cannot fit its own target tests
  # nothing. For scale, learned_centroid_lr already defaults to 1e-3, 200x
  # the rate the aux head gets.
  #
  # proto_predictor_lr defaults to config.learning_rate, so every existing
  # arm and fingerprint is untouched; only these arms set it.

  # Does the BEST aux arm we have improve with a properly trained head?
  - <<: *template
    name: "uf4_whitevad_lr"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 1.0
    proto_predictor_hidden_dim: 0
    proto_predictor_lr: 1e-3
    use_muted_mixup: false

  # Is the nonlinear head actually worse once it can train?
  - <<: *template
    name: "uf4_auxnl_lr"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 1.0
    proto_predictor_hidden_dim: 256
    proto_predictor_lr: 1e-3
    use_muted_mixup: false
    aux_vad_mixup: false

  # The original question, now interpretable: does requiring the head to map
  # a blended embedding to the blended affect coordinates help?
  - <<: *template
    name: "uf4_auxnl_mix_lr"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-6
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 1.0
    proto_predictor_hidden_dim: 256
    proto_predictor_lr: 1e-3
    use_muted_mixup: false
    aux_vad_mixup: true
    aux_vad_mixup_weight: 1.0
    aux_vad_mixup_alpha: 2.0
    aux_vad_mixup_fold: true
    aux_vad_mixup_shuffle: false

  # ==== Three remaining levers, in the agreed order ====
  #
  # Six mechanism variants have now failed to improve on uf4_softmix
  # (empirical priors, calibrated offset, consensus fitting, same-class
  # gate, consensus trust, aux VAD mixup), which is itself evidence the
  # geometry target sits at its natural operating point. What is left is
  # combination and budget, not refinement of the target rule.
  #
  # 3. aux VAD AND geometry mixup together. Never run: the mixup arms all
  #    carry proto_predictor_weight 0.0. uf4_whitevad is the strongest
  #    SAMSEMO arm we have (70.42 UAR / 68.49 acc) and acts on the encoder
  #    during training, where the mixup target acts on synthetic points, so
  #    redundancy is not the default expectation. The _ctrl arm is the
  #    established pooled-shuffle aux placebo, so an additive gain can be
  #    attributed to the aux SIGNAL rather than to the extra head.
  # 2. More blends per real sample. The encoder pass is already paid for;
  #    extra blends cost only a classifier-head pass. repeats=1 is verified
  #    bit-identical to the previous behaviour.
  # 1. Mixup loss weight, never varied from 0.5. Straightforward tuning,
  #    reported as such.

  - <<: *template
    name: "uf4_softmix_aux"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: "5e-6"
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 1.0
    proto_predictor_shuffle: false
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true

  - <<: *template
    name: "uf4_softmix_aux_ctrl"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: "5e-6"
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 1.0
    proto_predictor_shuffle: true
    proto_shuffle_mode: "pool"
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true

  - <<: *template
    name: "uf4_softmix_x2"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: "5e-6"
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    proto_predictor_shuffle: false
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true
    muted_mixup_repeats: 2

  - <<: *template
    name: "uf4_softmix_w025"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: "5e-6"
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    proto_predictor_shuffle: false
    use_muted_mixup: true
    muted_mixup_weight: 0.25
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true

  - <<: *template
    name: "uf4_softmix_w10"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: "5e-6"
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    proto_predictor_shuffle: false
    use_muted_mixup: true
    muted_mixup_weight: 1.0
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true

  # ==== Per-modality mixup: blend the branches BEFORE fusion ====
  #
  # Every other arm blends the post-fusion embedding, so audio and text move
  # together under one lambda. These blend the branch outputs separately,
  # reaching points no joint blend can produce -- the audio of one utterance
  # with mostly the text of another.
  #
  # THE TARGET IS AN APPROXIMATION HERE, unlike every other arm. With
  # independent coefficients the blend is not lam*z_a + (1-lam)*z_b for any
  # single lam, and cross-attention fusion is nonlinear, so the exact
  # correspondence is gone. Annotations cannot supply the missing quantity
  # either: a rater scored the utterance, not its modalities. The target
  # uses an effective coefficient lam_eff = w*lam_audio + (1-w)*lam_text
  # with w = 0.638, the audio branch's share of above-chance accuracy from
  # the modality ablation (audio-only 64.4, text-only 47.4, chance 25). One
  # global constant from an existing measurement, not a per-sample
  # pseudo-label.
  #
  # Measured before running: the independent and joint targets differ by a
  # median total variation of only 0.006, because averaging two lambda draws
  # concentrates lam_eff. So the label is effectively held fixed and these
  # arms test whether the CHIMERA INPUTS help, which is the cleaner reading.
  #
  # _ctrl shares one lambda across both modalities: algebraically the joint
  # blend, routed through the same pre-fusion path. It isolates per-modality
  # independence from the change of where the blend happens.

  - <<: *template
    name: "uf4_softmix_pm"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: "5e-6"
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true
    muted_mixup_per_modality: true
    muted_mixup_modality_independent: true
    muted_mixup_w_audio: 0.638

  - <<: *template
    name: "uf4_softmix_pm_ctrl"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: "5e-6"
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true
    muted_mixup_per_modality: true
    muted_mixup_modality_independent: false
    muted_mixup_w_audio: 0.638

  # ==== Blend ONE modality only ====
  #
  # uf4_softmix_pmaudio blends the audio branch and takes the text branch
  # wholly from the source; uf4_softmix_pmtext is its mirror and serves as
  # the contrast. Motivated by the modality ablation: audio-only reaches
  # 64.4 percent against text-only 47.4 (chance 25), and text's entire
  # contribution is +11 happy recall. So blending text may mostly inject
  # noise while blending audio acts where the signal is.
  #
  # The effective coefficient becomes w*lam_audio + (1 - w) for audio_only,
  # which leans the target on the source -- correct, since the text is
  # entirely the source's. Measured lam_eff: audio_only mean 0.804,
  # text_only 0.889, against 0.693 for a joint blend.
  #
  # Expectations should be low: the independent-lambda chimera arm lost to
  # its own shared-lambda control by 0.69 / 0.44 UAR. These are milder
  # chimeras (one branch intact rather than both mixed) but the same
  # off-manifold concern applies, and the target remains an approximation.

  - <<: *template
    name: "uf4_softmix_pmaudio"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: "5e-6"
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true
    muted_mixup_per_modality: true
    muted_mixup_modality_mode: "audio_only"
    muted_mixup_w_audio: 0.638

  - <<: *template
    name: "uf4_softmix_pmtext"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: "5e-6"
    seeds: [42, 189, 7]
    test_datasets: ["IEMOFULL", "SAMSEMO"]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true
    muted_mixup_per_modality: true
    muted_mixup_modality_mode: "text_only"
    muted_mixup_w_audio: 0.638

  # Seeds 1234 and 2024 for the endpoint-posterior ablation, taking it to
  # n=5 to match the arms it is compared against. Config-identical to
  # uf4_softmix_endpt apart from the seed list, verified key by key, so the
  # two pool as one arm in analysis. A separate entry rather than an edited
  # seeds list because seeds is part of the training fingerprint: extending
  # the parent's list would mark its three finished seeds stale.
  - <<: *template
    name: "uf4_softmix_endpt_more"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: "5e-6"
    seeds: [1234, 2024]
    test_datasets: [IEMOFULL, SAMSEMO]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true
    muted_mixup_endpoint_posterior: true

  # ==== Does longer training help, and does the gap survive it? ====
  #
  # Diagnosed on SAMSEMO: total error mass is identical between ours (32.69
  # percent) and vanilla (32.70), so the method RELOCATES errors rather than
  # reducing them there. It repairs happy->neutral by 0.56 points of the
  # corpus and breaks neutral->happy by 0.46. Neutral and happy are 82.3
  # percent of SAMSEMO and the second-closest pair in VAD space, and
  # neutral+happy is the most common blend type at 25.9 percent, so nearly
  # all the method's effort lands on one boundary where it is symmetric.
  # Consistent with macro AUC being flat to slightly negative there: the
  # ranking does not improve, only the operating point moves.
  #
  # Therefore no boundary-moving variant can raise SAMSEMO, which is what all
  # seventeen tried so far have confirmed. The remaining route is better
  # DISCRIMINATION, so: train twice as long. Synthetic-data methods often
  # need longer to pay off, and the cosine schedule already anneals to
  # num_epochs so extending it is clean.
  #
  # BOTH arms get the longer budget, because a change that lifts vanilla too
  # tells us nothing about the gap. Two seeds each first.

  - <<: *template
    name: "uf4_softmix_e16"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: "5e-6"
    seeds: [42, 189]
    num_epochs: 16
    test_datasets: [IEMOFULL, SAMSEMO]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true

  - <<: *template
    name: "uf4_softmix_vanilla_e16"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: "5e-6"
    seeds: [42, 189]
    num_epochs: 16
    test_datasets: [IEMOFULL, SAMSEMO]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true
    muted_mixup_vanilla_target: true

  # ==== Prototype pull: blend each sample toward its own class centre ====
  #
  # Motivated by a measured association. Across 44 mixup runs the share of
  # embedding variance that is WITHIN class correlates with UAR at
  # r = -0.451 (p = 0.002): tighter classes go with better transfer. The same
  # correlation is absent in the auxiliary family (r = +0.212, p = 0.26), so
  # it is specific to this mechanism. Pooled over all 79 runs it washes out
  # to r = -0.141 (p = 0.21) because the no-mixup baselines are both the
  # loosest AND the worst, which is the confound the split controls for.
  #
  # Mechanism: an EMA of per-class embedding centroids, and each sample is
  # blended toward its OWN class centroid with lambda folded to [0.5, 1].
  # Both endpoints share a class, so the target is a plain one-hot and none
  # of the geometry labelling machinery applies. A running centroid rather
  # than a same-class partner because at batch size 16 a sad row (10.7
  # percent of the pool) often has no same-class partner at all. Centroids
  # are updated AFTER the loss so a sample is never pulled toward a target
  # computed from its own current embedding.
  #
  # NOT NOVEL in itself: this is center loss (Wen et al. 2016) expressed as
  # mixup. It is run as a COMPOSITION test, asking whether the geometry
  # target still adds on top of prototype regularisation, not as a claim.
  #
  # Counter-evidence to weigh: uf4_softmix_gate made same-class blends
  # one-hot and lost 0.53 UAR (p=0.002). That arm used RANDOM same-class
  # partners, so if the pull works the active ingredient has to be the
  # prototypicality of the target, not same-class blending as such.
  #
  # The _ctrl placebo pulls toward the class-agnostic mean of the centroids
  # with the displacement RESCALED to the real pull's magnitude. Without
  # rescaling the global mean sits far from any class centroid and moves
  # samples 5.6x further, so the placebo would lose on intervention size
  # rather than on class-specificity. Verified: displacement ratio 1.000,
  # and it leaves own-class distance unchanged (2.831 vs 1.965).

  - <<: *template
    name: "uf4_softmix_pull"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: "5e-6"
    seeds: [42, 189, 7]
    test_datasets: [IEMOFULL, SAMSEMO]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true
    use_proto_pull: true
    proto_pull_weight: 0.5
    proto_pull_alpha: 2.0
    proto_pull_momentum: 0.9
    proto_pull_global: false

  - <<: *template
    name: "uf4_softmix_pull_ctrl"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: "5e-6"
    seeds: [42, 189, 7]
    test_datasets: [IEMOFULL, SAMSEMO]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true
    use_proto_pull: true
    proto_pull_weight: 0.5
    proto_pull_alpha: 2.0
    proto_pull_momentum: 0.9
    proto_pull_global: true

  - <<: *template
    name: "uf4_pull_only"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: "5e-6"
    seeds: [42, 189, 7]
    test_datasets: [IEMOFULL, SAMSEMO]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: false
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true
    use_proto_pull: true
    proto_pull_weight: 0.5
    proto_pull_alpha: 2.0
    proto_pull_momentum: 0.9
    proto_pull_global: false

  # ==== Mixing RATIO: how many blends go toward the class centre ====
  #
  # Count-fixed, unlike uf4_softmix_pull which added a separate loss term on
  # top. Here a fraction of blends simply have their partner replaced by the
  # row's own class centroid, so the number of synthetic samples and the
  # gradient scale are unchanged and the fraction is a genuine ratio.
  # Verified: fraction 0.0 is bit-identical to the base arm.
  #
  # Both endpoints of the ratio are already measured at seed 42:
  #   fraction 0.0  = uf4_softmix        IEMOCAP 65.23 UAR / SAMSEMO 69.80
  #   fraction 1.0 ~= uf4_pull_only      IEMOCAP 62.55      / SAMSEMO 68.45
  # Pull-only sits within 0.03 of the NO-MIXUP baseline on IEMOCAP and 0.78
  # below it on SAMSEMO, so the ratio interpolates between a strong arm and a
  # null one. It can only beat the base arm if the response is non-monotonic,
  # which does happen with auxiliary terms but which nothing here predicts.
  # Screening only: at one seed, with the base arm's sd of 0.95 UAR, a
  # two-point sweep will produce a "winner" by noise, so anything that looks
  # promising needs n=3 before it means anything.

  - <<: *template
    name: "uf4_softmix_r25"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: "5e-6"
    seeds: [42, 189, 7]
    test_datasets: [IEMOFULL, SAMSEMO]
    class_weight_mode: "sqrt_inverse_freq"
    use_proto_predictor: true
    proto_target: "whitevad"
    proto_predictor_weight: 0.0
    use_muted_mixup: true
    muted_mixup_weight: 0.5
    muted_mixup_alpha: 2.0
    muted_mixup_general_soft: true
    muted_mixup_pull_fraction: 0.25
