  # Every GenLabel arm we have run pins gamma at 1.0, the most aggressive
  # point on that grid, which is also the only point at which the one-hot
  # saturation of the unreduced 1024-d density reaches the loss undiluted.
  # Reporting that configuration as "GenLabel as published" attributes to
  # their method a failure caused by our own choice of gamma.
  #
  # These two probes plus the existing uf4_genlabel_raw seed 42 give three
  # points on the grid at one seed. Selection is on the MSP-Podcast
  # DEVELOPMENT split, read from the heldout.npz dump each run already
  # writes, never on any test corpus. The winner is then run at five seeds.
  #
  # gamma 0.0 is not probed: it is vanilla mixup by construction and already
  # exists as uf4_softmix_vanilla.
  - <<: *template
    name: "uf4_genlabel_raw_g02"
    unfreeze_audio_layers: 4
