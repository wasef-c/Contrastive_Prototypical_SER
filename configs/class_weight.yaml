  # ==== THE PLACEBO for the geometry target ====
  #
  # Every other control changes what the target IS. This one keeps the target
  # distribution exactly and destroys only its correspondence to the blend:
  # finished targets are permuted among blends sharing a source label, so the
  # marginal, the entropy and the per-class target distribution are identical.
  # Verified on 4,000 real blends: marginal identical, entropy 0.8506 both,
  # mean max 0.6206 both, mass on the source label 0.4970 both, while 99.9
  # percent of rows receive a different target and 56.2 percent a different
  # argmax.
  #
  # Why vanilla mixup does not already serve as this control: its target has
  # entropy 0.39 against this method's 0.85 and can only place mass on the
  # two parents' labels. Beating vanilla therefore does not rule out the
  # possibility that any sufficiently diffuse soft target would do as well.
  # Only a matched-distribution shuffle rules that out. If the gain survives
  # here, the target's content is irrelevant and the mechanism reduces to
  # label smoothing with an unusual shape.

  - <<: *template
    name: "uf4_softmix_shuf"
    unfreeze_audio_layers: 4
    unfreeze_bert_layers: 4
    bert_learning_rate: "5e-6"
