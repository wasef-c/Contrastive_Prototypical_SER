# Text Model & Prototypicality Ablation
# Compares: BERT vs RoBERTa vs DeBERTa-v3 with unfreeze levels + prototypicality methods
# Run with: python runner.py --config configs/text_model_ablation.yaml --all

template_config: &template
  wandb_project: "text_model_ablation"
  seeds: [42]

  # Task
  task_type: "classification"
  num_classes: 4

  # Model
  modality: "both"
  audio_dim: 768
  text_max_length: 128
  hidden_dim: 1024
  dropout: 0.1

  # Defaults
  text_model_name: "bert-base-uncased"
  unfreeze_bert_layers: 0
  bert_learning_rate: 5e-7

  # Fusion
  fusion_type: "cross_attention"
  fusion_hidden_dim: 1024
  num_attention_heads: 8

  # Training
  num_epochs: 64
  batch_size: 128
  learning_rate: 5e-6
  weight_decay: 1e-4
  val_split: 0.1
  early_stopping_patience: 10

  # Off by default
  use_contrastive: false
  contrastive_weight: 0.0
  use_domain_adversarial: false
  use_prototypical_weighting: false
  use_prototypical_label_smoothing: false
  use_proto_predictor: false

  expected_vad:
    0: [0.4896, 0.5458, 0.5458]
    1: [0.7127, 0.5518, 0.5518]
    2: [0.3060, 0.4895, 0.4895]
    3: [0.2397, 0.6102, 0.6102]


