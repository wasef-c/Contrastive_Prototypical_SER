  #   test_datasets: ["CMUMOSEI", "SAMSEMO"]
  #   audio_encoder_type: "wav2vec2"
  #   unfreeze_audio_layers: 0
  #   batch_size: 8

  # ============================================================
  # 2. WAV2VEC2 UNFREEZE — layer sweep (0, 2, 4)
  # ============================================================
  - <<: *template
    name: "W2V_ALL3_wav2vec2_unfreeze2"
    train_dataset: ["IEMO", "MSPI", "MSPP"]
    test_datasets: ["CMUMOSEI", "SAMSEMO"]
    audio_encoder_type: "wav2vec2"
    unfreeze_audio_layers: 2
    audio_learning_rate: 5e-7
    batch_size: 4

  - <<: *template
    name: "W2V_ALL3_wav2vec2_unfreeze4"
    train_dataset: ["IEMO", "MSPI", "MSPP"]
    test_datasets: ["CMUMOSEI", "SAMSEMO"]
    audio_encoder_type: "wav2vec2"
    unfreeze_audio_layers: 4
    audio_learning_rate: 5e-7
    batch_size: 4

  - <<: *template
    name: "W2V_ALL3_wav2vec2_unfreezeAll"
    train_dataset: ["IEMO", "MSPI", "MSPP"]
    test_datasets: ["CMUMOSEI", "SAMSEMO"]
    audio_encoder_type: "wav2vec2"
    unfreeze_audio_layers: 6
    audio_learning_rate: 5e-7
    batch_size: 4

  # ============================================================
  # 3. WAV2VEC2 + BERT UNFREEZE combined
  # ============================================================
  - <<: *template
    name: "W2V_ALL3_wav2vec2_uf2_bert_uf4"
    train_dataset: ["IEMO", "MSPI", "MSPP"]
    test_datasets: ["CMUMOSEI", "SAMSEMO"]
    audio_encoder_type: "wav2vec2"
    unfreeze_audio_layers: 2
    audio_learning_rate: 5e-7
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-7
    batch_size: 4

  - <<: *template
    name: "W2V_ALL3_wav2vec2_uf4_bert_uf4"
    train_dataset: ["IEMO", "MSPI", "MSPP"]
    test_datasets: ["CMUMOSEI", "SAMSEMO"]
    audio_encoder_type: "wav2vec2"
    unfreeze_audio_layers: 4
    audio_learning_rate: 5e-7
    unfreeze_bert_layers: 4
    bert_learning_rate: 5e-7
    batch_size: 4

  # ============================================================
  # 4. TWO-STAGE TRAINING — percentile 50% and 70%
  # ============================================================
  # - <<: *template
  #   name: "W2V_ALL3_twostage_p50"
