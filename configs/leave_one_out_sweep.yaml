# Leave-One-Out Cross-Validation (VAD datasets only)
# Train on 2 corpora, test on the held-out one. 3 folds.
# Each fold: baseline vs da_embedding (best from previous sweep)
# 6 experiments x 1 seed = 6 runs
# Run with: python runner.py --config configs/leave_one_out_sweep.yaml --all
#
# VRAM budget: ~24 GB (3090)

template_config: &template
  wandb_project: "LeaveOneOut_DomainAdversarial"
  seeds: [30]

  # Task
  task_type: "classification"
  num_classes: 4

  # Model
  modality: "both"
  audio_dim: 768
  text_model_name: "bert-base-uncased"
  text_max_length: 128
  hidden_dim: 1024
  dropout: 0.1

  # Emotion2Vec encoder — UF4
  audio_encoder_type: "emotion2vec"
  audio_model_name: "iic/emotion2vec_base"
  unfreeze_audio_layers: 2
  audio_learning_rate: 5e-7
  max_audio_seconds: 25

  # BERT — UF4
  unfreeze_bert_layers: 2
  bert_learning_rate: 5e-7

  # Fusion
  fusion_type: "cross_attention"
  fusion_hidden_dim: 1024
  num_attention_heads: 8

  # Training
  num_epochs: 20
  batch_size: 24
  eval_batch_size: 24
  gradient_accumulation_steps: 12
  num_workers: 4
  learning_rate: 5e-6
  weight_decay: 1e-4
  val_split: 0.1
  early_stopping_patience: 3

  # Adversarial defaults
  use_domain_adversarial: false
  adversarial_weight: 0.1
  adversarial_alpha: 2.0
  adversarial_hidden_dim: 256
  use_prototypical_adversarial: true
  adversarial_peak_lambda: 1.0
  adversarial_warmup_frac: 0.5

  # Off
  use_contrastive: false
  use_modality_adversarial: false
  use_multiview_prototypicality: false
  use_hard_negative_mining: false
  use_prototypical_weighting: false
  use_memory_bank: false
  use_cross_modal_projection: false
  use_two_stage_training: false
  use_prototypical_label_smoothing: false
  use_proto_predictor: false

  # MSPP-specific centroids
  expected_vad:
    0: [0.4895, 0.4885, 0.5267]
    1: [0.6369, 0.6091, 0.6089]
    2: [0.3567, 0.3964, 0.4427]
    3: [0.2475, 0.7317, 0.7516]


experiments:
  # ============================================================
  # Fold 1: Hold out IEMO — train on MSPI+MSPP
  # ============================================================
  - <<: *template
    name: "loo_iemo_baseline"
    train_dataset: ["MSPI", "MSPP"]
    test_datasets: ["IEMO","CMUMOSEI", "SAMSEMO"]

  - <<: *template
    name: "loo_iemo_da"
    train_dataset: ["MSPI", "MSPP"]
    test_datasets: ["IEMO","CMUMOSEI", "SAMSEMO"]
    use_domain_adversarial: true
    use_modality_adversarial: true
    adversarial_weight: 0.1
    modality_adv_weight: 0.1
    use_prototypical_adversarial: true
    adversarial_alpha: 2.0
    adversarial_warmup_frac: 0.7
    adversarial_peak_lambda: 1.0

  # ============================================================
  # Fold 2: Hold out MSPI — train on IEMO+MSPP
  # ============================================================
  - <<: *template
    name: "loo_mspi_baseline"
    train_dataset: ["IEMO", "MSPP"]
    test_datasets: ["MSPI","CMUMOSEI", "SAMSEMO"]

  - <<: *template
    name: "loo_mspi_da"
    train_dataset: ["IEMO", "MSPP"]
    test_datasets: ["MSPI","CMUMOSEI", "SAMSEMO"]
    use_domain_adversarial: true
    use_modality_adversarial: true
    adversarial_weight: 0.1
    modality_adv_weight: 0.1
    use_prototypical_adversarial: true
    adversarial_alpha: 2.0
    adversarial_warmup_frac: 0.7
    adversarial_peak_lambda: 1.0

  # ============================================================
  # Fold 3: Hold out MSPP — train on IEMO+MSPI
  # ============================================================
  - <<: *template
    name: "loo_mspp_baseline"
    train_dataset: ["IEMO", "MSPI"]
    test_datasets: ["MSPP","CMUMOSEI", "SAMSEMO"]

  - <<: *template
    name: "loo_mspp_da"
    train_dataset: ["IEMO", "MSPI"]
    test_datasets: ["MSPP","CMUMOSEI", "SAMSEMO"]
    use_domain_adversarial: true
    use_modality_adversarial: true
    adversarial_weight: 0.1
    modality_adv_weight: 0.1
    use_prototypical_adversarial: true
    adversarial_alpha: 2.0
    adversarial_warmup_frac: 0.7
    adversarial_peak_lambda: 1.0