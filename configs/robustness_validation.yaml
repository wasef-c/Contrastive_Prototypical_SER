# Robustness Validation: Multi-seed + Fixed VAD + Adaptive Difficulty
# Fixes: correct MSPP dominance values, BatchNorm restored, drop_last=True
# Run with: python runner.py --config configs/robustness_validation.yaml --all
#
# VRAM budget: 24 GB

template_config: &template
  wandb_project: "Proto_anchored_robustness"
  seeds: [42, 123, 7]

  # Task
  task_type: "classification"
  num_classes: 4

  # Model
  modality: "both"
  audio_dim: 768
  text_model_name: "bert-base-uncased"
  text_max_length: 128
  hidden_dim: 1024
  dropout: 0.1

  # Emotion2Vec encoder — UF4
  audio_encoder_type: "emotion2vec"
  audio_model_name: "iic/emotion2vec_base"
  unfreeze_audio_layers: 4
  audio_learning_rate: 5e-7
  max_audio_seconds: 30

  # BERT — UF4
  unfreeze_bert_layers: 4
  bert_learning_rate: 5e-7

  # Fusion
  fusion_type: "cross_attention"
  fusion_hidden_dim: 1024
  num_attention_heads: 8

  # Training
  num_epochs: 50
  batch_size: 6
  gradient_accumulation_steps: 20
  learning_rate: 5e-6
  weight_decay: 1e-4
  val_split: 0.1
  early_stopping_patience: 5

  # Contrastive defaults
  use_contrastive: false
  contrastive_loss_type: "prototype_anchored"
  contrastive_weight: 0.5
  contrastive_temperature: 0.07
  contrastive_warmup_epochs: 5
  projection_dim: 128
  projection_hidden_dim: 512

  # Proto-Anchored loss defaults
  prototypical_alpha: 1.0
  prototypical_beta: 0.5
  margin_base: 0.1
  separation_margin: 2.0
  separation_weight: 0.5
  use_adaptive_difficulty: false

  # Off
  use_two_stage_training: false
  use_prototypical_weighting: false
  use_prototypical_label_smoothing: false
  use_domain_adversarial: false
  use_proto_predictor: false

  # Dataset — MSPP only, 4 test sets
  train_dataset: "MSPP"
  test_datasets: ["IEMO", "MSPI", "CMUMOSEI", "SAMSEMO"]

  # FIXED: correct MSPP-only centroids (no test data leakage)
  expected_vad:
    0: [0.4895, 0.4885, 0.5267]
    1: [0.6369, 0.6091, 0.6089]
    2: [0.3567, 0.3964, 0.4427]
    3: [0.2475, 0.7317, 0.7516]


experiments:
  # ============================================================
  # 1. Baseline: UF4 + BERT4, no contrastive (3 seeds)
  # ============================================================
  - <<: *template
    name: "robust_baseline"

  # ============================================================
  # 2. Proto-anchored with fixed MSPP VAD (3 seeds)
  # ============================================================
  - <<: *template
    name: "robust_proto_anchored"
    use_contrastive: true

  # ============================================================
  # 3. Proto-anchored with adaptive difficulty (3 seeds)
  #    Difficulty from embedding-space distance to learned prototypes
  #    instead of fixed VAD centroids. End-to-end adaptive.
  # ============================================================
  - <<: *template
    name: "robust_proto_adaptive"
    use_contrastive: true
    use_adaptive_difficulty: true

  # ============================================================
  # 4. Proto-anchored adaptive + prototypical CE weighting (3 seeds)
  # ============================================================
  - <<: *template
    name: "robust_proto_adaptive_ceweight"
    use_contrastive: true
    use_adaptive_difficulty: true
    use_prototypical_weighting: true
    prototypical_weighting_alpha: 2.0
